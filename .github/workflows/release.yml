name: portable-release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  portable:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate release tag
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $expected = "v" + ((Get-Content frontend/package.json -Raw | ConvertFrom-Json).version)
          $backend = (Get-Content backend/__init__.py -Raw | Select-String '__version__ = "([^"]+)"').Matches.Groups[1].Value
          if ($tag -ne $expected -or $expected -ne "v$backend") { throw "Tag, frontend and backend versions must match." }
      - name: Select build interpreter
        shell: pwsh
        run: |
          $python = (Get-Command python).Source
          "XIAOA_BUILD_PYTHON=$python" >> $env:GITHUB_ENV
      - name: Install Python dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -r backend/requirements.txt -r backend/requirements-optional.txt -r backend/requirements-build.txt
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build and verify portable release
        shell: pwsh
        timeout-minutes: 45
        run: ./deploy/build_release.ps1 -SkipDependencyInstall -SkipVersionIncrement
      - name: Publish verified GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          gh release create "$env:GITHUB_REF_NAME" frontend/dist/XiaoA.exe release-assets/build-manifest.json LICENSE LICENSE-COMMERCIAL.md THIRD-PARTY-NOTICES.md --repo "$env:GITHUB_REPOSITORY" --verify-tag --generate-notes
