    const micBtn = document.getElementById("mic");
    const voiceHint = document.getElementById("voiceHint");
    let ttsAudio = null;
    let ttsResolve = null, browserSpeechResolve = null;
    let speakSeq = 0;   // 递增序号:新的一次朗读会作废上一次未播完的分段
    let speakNextReply = false;  // 下一条回复是否朗读(仅唤醒触发的那轮为 true)
    // 唤醒轮里,走工具的任务会先发一条"边想边说"的开场白(message/message_end),
    // 真正的结论最后才来。这里只暂存"最新一条"助手正文,等整轮 done 时才朗读,
    // 保证念的是最终答案而不是开场白。手动/连续对话不用它。
    let wakeReplyText = "";
    let fromWake = false;        // 当前这轮语音是否由唤醒触发(唤醒的自动发,手动的只填入)
    let continuousActive = false, continuousState = "off", continuousToken = 0;
    let continuousStarting = false;
    let continuousAbort = null, continuousAwaitingReply = false;
    let continuousTaskDone = false, continuousReplyReady = false, continuousReplyText = "";
    let continuousQueued = false;
    let continuousPausedWake = false;
    let streamSpeech = null;

    const CONTINUOUS_LABELS = {
      off: "连续对话", preparing: "准备中", listening: "正在听", transcribing: "识别中",
      thinking: "思考中", speaking: "正在说", executing: "执行中",
    };
    function setContinuousState(state) {
      continuousState = state;
      continuousButton.dataset.state = state;
      continuousButton.setAttribute("aria-pressed", String(continuousActive));
      continuousButton.title = continuousActive ? "退出连续语音对话" : "开启连续语音对话";
      continuousLabel.textContent = CONTINUOUS_LABELS[state] || CONTINUOUS_LABELS.off;
      micBtn.title = continuousActive ? "打断或立即结束本轮说话" : "按住或点击说话";
    }

    function cancelSpeech() {
      speakSeq++;
      if (streamSpeech) streamSpeech.cancelled = true;
      streamSpeech = null;
      if (window.speechSynthesis) window.speechSynthesis.cancel();
      if (ttsAudio) {
        const audio = ttsAudio; ttsAudio = null;
        try { audio.pause(); audio.currentTime = 0; } catch (_) {}
      }
      if (ttsResolve) { const done = ttsResolve; ttsResolve = null; done(); }
      if (browserSpeechResolve) { const done = browserSpeechResolve; browserSpeechResolve = null; done(); }
    }

    // 把长文本按标点/长度切成小段(腾讯云 TextToVoice 单次约150字上限,取120留余量)
    function splitForTts(text, maxLen) {
      maxLen = maxLen || 120;
      const parts = [];
      let cur = "";
      for (const seg of text.split(/(?<=[。!?;\n.!?])/)) {
        if (!seg) continue;
        if ((cur + seg).length <= maxLen) { cur += seg; continue; }
        if (cur) { parts.push(cur); cur = ""; }
        if (seg.length <= maxLen) { cur = seg; }
        else { for (let i = 0; i < seg.length; i += maxLen) parts.push(seg.slice(i, i + maxLen)); }
      }
      if (cur.trim()) parts.push(cur);
      return parts.filter(function (p) { return p.trim(); });
    }

    async function ttsOne(text, voice) {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 15000);
      try {
        const r = await fetch(API + "/api/tts", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: text, voice }), signal: controller.signal,
        });
        const d = await r.json();
        return d.ok && d.audio ? d.audio : null;
      } finally {
        clearTimeout(timeout);
      }
    }
    async function ttsReliable(text, voice) {
      let audio = await ttsOne(text, voice).catch(() => null);
      if (audio) return audio;
      await new Promise(resolve => setTimeout(resolve, 300));
      return ttsOne(text, voice).catch(() => null);
    }
    function playAudioB64(b64) {
      return new Promise(function (resolve) {
        const audio = new Audio("data:audio/mpeg;base64," + b64);
        const finish = () => {
          if (ttsAudio === audio) ttsAudio = null;
          if (ttsResolve === finish) ttsResolve = null;
          resolve();
        };
        ttsAudio = audio;
        ttsResolve = finish;
        audio.onended = finish;
        audio.onerror = finish;
        audio.play().catch(finish);
      });
    }

    async function speakPart(text, mySeq, preparedAudio) {
      const clean = (text || "").replace(/[*#`_>\-]/g, "").trim();
      if (!clean) return;

      if (voiceCloud || preparedAudio) {
        const segs = splitForTts(clean);
        try {
          // 边播边预取下一段,减少段间停顿
          let nextAudio = preparedAudio ? preparedAudio[0] : ttsReliable(segs[0]);
          for (let i = 0; i < segs.length; i++) {
            const b64 = await nextAudio;
            if (mySeq !== speakSeq) return;         // 被新一次朗读打断
            if (!b64) {
              voiceHint.textContent = "⚠ 云端语音暂时失败，未切换其他音色";
              return;
            }
            if (i + 1 < segs.length) {
              nextAudio = preparedAudio ? preparedAudio[i + 1] : ttsReliable(segs[i + 1]);
            }
            await playAudioB64(b64);
            if (mySeq !== speakSeq) return;
          }
        } catch (_) {
          voiceHint.textContent = "⚠ 云端语音暂时失败，未切换其他音色";
        }
        return;
      }
      if (window.speechSynthesis) {
        await new Promise((resolve) => {
          const u = new SpeechSynthesisUtterance(clean);
          let fallbackTimer = null;
          const finish = () => {
            if (fallbackTimer) clearTimeout(fallbackTimer);
            if (browserSpeechResolve === finish) browserSpeechResolve = null;
            resolve();
          };
          browserSpeechResolve = finish;
          u.lang = "zh-CN"; u.rate = 1.05; u.onend = finish; u.onerror = finish;
          window.speechSynthesis.speak(u);
          fallbackTimer = setTimeout(finish, Math.max(3000, Math.min(30000, clean.length * 250)));
        });
      }
    }

    // ===== 朗读回复(TTS):优先腾讯云(长文本分段顺序播),不可用退回浏览器合成 =====
    async function speak(text) {
      cancelSpeech();
      return speakPart(text, speakSeq);
    }

    function beginStreamSpeech() {
      if (streamSpeech) return streamSpeech;
      const continuous = continuousActive && continuousAwaitingReply;
      // 只有连续对话才边流边念。唤醒轮不在这里念:走工具时先来的是开场白,
      // 边流边念就会把 speakNextReply 消费在开场白上,最终答案反而不念。
      // 唤醒轮的做法是在 message/message_end 里累积最新正文,done 时统一念(见 handleEvent)。
      if (!continuous) return null;
      cancelSpeech();
      streamSpeech = {
        buffer: "", chain: Promise.resolve(), pending: 0, ended: false,
        ttsPrepareSlots: [Promise.resolve(), Promise.resolve()], ttsPrepareIndex: 0,
        cancelled: false, seq: speakSeq, continuous: continuous, token: continuousToken,
      };
      return streamSpeech;
    }

    function queueStreamTts(state, text) {
      return splitForTts(text).map((segment) => {
        const slot = state.ttsPrepareIndex++ % state.ttsPrepareSlots.length;
        const request = state.ttsPrepareSlots[slot].then(() => {
          if (state.cancelled || streamSpeech !== state || state.seq !== speakSeq) return null;
          return ttsReliable(segment);
        });
        state.ttsPrepareSlots[slot] = request.catch(() => null);
        return request;
      });
    }

    function enqueueStreamSpeech(state, text) {
      const clean = String(text || "").replace(/[*#`_>\-]/g, "").trim();
      if (!clean) return;
      // 两路有界预取独立于播放链：播第 N 句时，N+1/N+2 已在下载。
      const preparedAudio = voiceCloud ? queueStreamTts(state, clean) : null;
      state.pending++;
      state.chain = state.chain.then(async () => {
        if (state.cancelled || streamSpeech !== state) return;
        if (state.continuous) {
          setContinuousState("speaking");
          voiceHint.textContent = "小A正在说，点麦克风可打断";
        }
        await speakPart(clean, state.seq, preparedAudio);
      }).finally(() => {
        state.pending--;
        maybeFinishStreamSpeech(state);
      });
    }

    const STREAM_TTS_MIN_CHARS = 8;
    const STREAM_TTS_MAX_CHARS = 80;
    function takeStreamSpeechChunk(text, flush) {
      const boundary = /[。！？!?；;\n]/g;
      let match;
      while ((match = boundary.exec(text))) {
        const cut = match.index + match[0].length;
        if (text.slice(0, cut).trim().length >= STREAM_TTS_MIN_CHARS) {
          return [text.slice(0, cut), text.slice(cut)];
        }
      }
      if (!flush && text.length < STREAM_TTS_MAX_CHARS) return null;
      const cut = flush ? text.length : STREAM_TTS_MAX_CHARS;
      return [text.slice(0, cut), text.slice(cut)];
    }

    function feedStreamSpeech(delta, flush) {
      let state = streamSpeech;
      if (!state && delta) state = beginStreamSpeech();
      if (!state || state.cancelled) return;
      if (delta) {
        state.ended = false;
        state.buffer += String(delta);
      }
      while (state.buffer) {
        const chunk = takeStreamSpeechChunk(state.buffer, flush);
        if (!chunk) break;
        state.buffer = chunk[1];
        enqueueStreamSpeech(state, chunk[0]);
      }
      if (flush) {
        state.ended = true;
        maybeFinishStreamSpeech(state);
      }
    }

    async function resumeContinuousAfterSpeech(state) {
      if (!continuousActive || state.token !== continuousToken || recording) return;
      await new Promise(resolve => setTimeout(resolve, 350));
      if (continuousActive && state.token === continuousToken && !recording) {
        startContinuousListening(state.token);
      }
    }

    function maybeFinishStreamSpeech(state) {
      if (streamSpeech !== state || state.cancelled || !state.ended || state.pending > 0) return;
      if (state.continuous && !continuousTaskDone) return;
      streamSpeech = null;
      if (state.continuous) {
        continuousAwaitingReply = false;
        void resumeContinuousAfterSpeech(state);
      }
    }

    function receiveContinuousReply(text) {
      if (!continuousActive || !continuousAwaitingReply) return;
      continuousReplyText = String(text || "").trim();
      continuousReplyReady = !!continuousReplyText;
      if (continuousReplyReady) feedStreamSpeech(continuousReplyText, true);
      else maybeCompleteContinuousReply();
    }
    function maybeCompleteContinuousReply() {
      if (!continuousActive || !continuousAwaitingReply || !continuousTaskDone) return;
      if (streamSpeech) {
        maybeFinishStreamSpeech(streamSpeech);
        return;
      }
      const token = continuousToken;
      if (!continuousReplyReady) {
        setTimeout(() => {
          if (continuousActive && continuousAwaitingReply && continuousTaskDone && token === continuousToken) {
            continuousAwaitingReply = false;
            startContinuousListening(token);
          }
        }, 250);
        return;
      }
      const reply = continuousReplyText;
      continuousAwaitingReply = false;
      void speakContinuousReply(reply, token);
    }
    async function speakContinuousReply(text, token) {
      if (!continuousActive || token !== continuousToken) return;
      setContinuousState("speaking");
      voiceHint.textContent = "小A正在说，点麦克风可打断";
      await speak(text);
      if (!continuousActive || token !== continuousToken || recording) return;
      // 关闭扬声器后稍等回声衰减，再打开麦克风，避免把自己的回复识别成新指令。
      await new Promise(resolve => setTimeout(resolve, 350));
      if (continuousActive && token === continuousToken && !recording) startContinuousListening(token);
    }

    // ===== 说话输入(STT):录音 -> 16k 单声道 WAV -> /api/asr =====
    let audioCtx = null, mediaStream = null, procNode = null, srcNode = null;
    let cachedMicStream = null, micIdleTimer = null;
    let pcmChunks = [], recording = false;

    async function acquireMicStream() {
      if (!cachedMicStream || cachedMicStream.getAudioTracks().every(track => track.readyState !== "live")) {
        cachedMicStream = await navigator.mediaDevices.getUserMedia({ audio: {
          echoCancellation: true, noiseSuppression: true, autoGainControl: true,
        } });
      }
      clearTimeout(micIdleTimer);
      cachedMicStream.getAudioTracks().forEach(track => { track.enabled = true; });
      return cachedMicStream;
    }

    function parkMicStream(stream) {
      if (!stream) return;
      stream.getAudioTracks().forEach(track => { track.enabled = false; });
      clearTimeout(micIdleTimer);
      micIdleTimer = setTimeout(() => {
        if (cachedMicStream !== stream) return;
        stream.getTracks().forEach(track => track.stop());
        cachedMicStream = null;
      }, 60000);
    }

    function floatTo16BitPCM(input) {
      const out = new Int16Array(input.length);
      for (let i = 0; i < input.length; i++) {
        const s = Math.max(-1, Math.min(1, input[i]));
        out[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
      }
      return out;
    }
    function downsample(buffer, inRate, outRate) {
      if (outRate >= inRate) return buffer;
      const ratio = inRate / outRate;
      const newLen = Math.round(buffer.length / ratio);
      const result = new Float32Array(newLen);
      let pos = 0, idx = 0;
      while (pos < newLen) {
        const next = Math.round((pos + 1) * ratio);
        let sum = 0, cnt = 0;
        for (let i = idx; i < next && i < buffer.length; i++) { sum += buffer[i]; cnt++; }
        result[pos] = cnt ? sum / cnt : 0;
        pos++; idx = next;
      }
      return result;
    }
    function encodeWav(samples, sampleRate) {
      const buf = new ArrayBuffer(44 + samples.length * 2);
      const view = new DataView(buf);
      const w = (off, str) => { for (let i = 0; i < str.length; i++) view.setUint8(off + i, str.charCodeAt(i)); };
      w(0, "RIFF"); view.setUint32(4, 36 + samples.length * 2, true); w(8, "WAVE");
      w(12, "fmt "); view.setUint32(16, 16, true); view.setUint16(20, 1, true);
      view.setUint16(22, 1, true); view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * 2, true); view.setUint16(32, 2, true); view.setUint16(34, 16, true);
      w(36, "data"); view.setUint32(40, samples.length * 2, true);
      let off = 44;
      for (let i = 0; i < samples.length; i++, off += 2) view.setInt16(off, samples[i], true);
      return new Blob([view], { type: "audio/wav" });
    }
    function blobToBase64(blob) {
      return new Promise((res) => {
        const r = new FileReader();
        r.onloadend = () => res(r.result.split(",")[1]);
        r.readAsDataURL(blob);
      });
    }
    // 把一段 16k PCM(Int16)发去识别,返回文字
    async function asrChunk(int16samples, externalSignal) {
      const wav = encodeWav(int16samples, 16000);
      const b64 = await blobToBase64(wav);
      const controller = new AbortController();
      const abort = () => controller.abort();
      if (externalSignal) externalSignal.addEventListener("abort", abort, { once: true });
      const timeout = setTimeout(() => controller.abort(), 12000);
      try {
        const r = await fetch(API + "/api/asr", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ audio: b64, format: "wav" }), signal: controller.signal,
        });
        return r.json();
      } catch (error) {
        if (error.name === "AbortError" && externalSignal && externalSignal.aborted) {
          const cancelled = new Error("语音识别已取消");
          cancelled.name = "AbortError";
          throw cancelled;
        }
        if (error.name === "AbortError") throw new Error("语音识别网络超时(12秒)");
        throw error;
      } finally {
        clearTimeout(timeout);
        if (externalSignal) externalSignal.removeEventListener("abort", abort);
      }
    }

    let analyser = null, silenceTimer = null, heardSpeech = false;

    async function startRecording() {
      mediaStream = await acquireMicStream();
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      srcNode = audioCtx.createMediaStreamSource(mediaStream);
      procNode = audioCtx.createScriptProcessor(4096, 1, 1);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 512;
      srcNode.connect(analyser);
      pcmChunks = [];
      let ready;
      const firstFrame = new Promise(resolve => { ready = resolve; });
      procNode.onaudioprocess = (e) => {
        pcmChunks.push(new Float32Array(e.inputBuffer.getChannelData(0)));
        if (ready) { ready(); ready = null; }
      };
      srcNode.connect(procNode);
      procNode.connect(audioCtx.destination);
      await Promise.race([firstFrame, new Promise(resolve => setTimeout(resolve, 800))]);
    }

    // 自动模式:检测音量,连续停顿约 2.2 秒且之前说过话,才自动结束发送。
    function startSilenceWatch() {
      heardSpeech = false;
      let quietSince = null;
      const buf = new Uint8Array(analyser.fftSize);
      const SILENCE = 6;       // 降低门槛，轻声和句尾不容易被当成静音
      const QUIET_MS = 2200;   // 给正常换气和句中停顿留足时间
      function tick() {
        if ((mode !== "auto" && mode !== "continuous") || !recording) return;
        analyser.getByteTimeDomainData(buf);
        let peak = 0;
        for (let i = 0; i < buf.length; i++) peak = Math.max(peak, Math.abs(buf[i] - 128));
        const now = Date.now();
        if (peak > SILENCE) { heardSpeech = true; quietSince = null; }
        else if (heardSpeech) {
          if (quietSince === null) quietSince = now;
          else if (now - quietSince > QUIET_MS) { finishAuto(); return; }
        }
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    }

    async function finishAuto() {
      if (!recording) return;
      const sourceMode = mode;
      recording = false; mode = null;
      micBtn.classList.remove("listening");
      await stopRecordingAndSend(sourceMode);
    }
    async function releaseRecording() {
      try { procNode.disconnect(); srcNode.disconnect(); } catch (_) {}
      parkMicStream(mediaStream);
      try { audioCtx && await audioCtx.close(); } catch (_) {}
      audioCtx = mediaStream = procNode = srcNode = analyser = null;
    }
    async function cancelRecording() {
      recording = false; mode = null; pcmChunks = [];
      micBtn.classList.remove("listening");
      await releaseRecording();
    }
    async function stopRecordingAndSend(sourceMode) {
      const inRate = audioCtx.sampleRate;
      try { procNode.disconnect(); srcNode.disconnect(); } catch (_) {}
      parkMicStream(mediaStream);
      // 合并 PCM
      let len = pcmChunks.reduce((a, c) => a + c.length, 0);
      const merged = new Float32Array(len);
      let o = 0; for (const c of pcmChunks) { merged.set(c, o); o += c.length; }
      const pcm16 = floatTo16BitPCM(downsample(merged, inRate, 16000));
      try { audioCtx && await audioCtx.close(); } catch (_) {}
      audioCtx = mediaStream = procNode = srcNode = analyser = null;
      const continuousTurn = sourceMode === "continuous" && continuousActive;
      const turnToken = continuousToken;
      if (continuousTurn) setContinuousState("transcribing");
      // 腾讯云一句话识别单次上限约60秒/3MB。超长就切成 ≤55秒 多段分别识别再拼接,
      // 这样说多长都行,不会再报 "Data larger than 3MB",也不丢内容。
      const CHUNK = 16000 * 55;
      voiceHint.textContent = "识别中…";
      const slowTimer = setTimeout(() => { voiceHint.textContent = "识别中…网络较慢"; }, 3000);
      try {
        let full = "";
        const total = Math.ceil(pcm16.length / CHUNK) || 1;
        for (let i = 0; i < pcm16.length || i === 0; i += CHUNK) {
          if (total > 1) voiceHint.textContent = `识别中…(${Math.floor(i / CHUNK) + 1}/${total} 段)`;
          const seg = pcm16.subarray(i, Math.min(i + CHUNK, pcm16.length));
          if (!seg.length) break;
          const d = await asrChunk(seg, continuousTurn && continuousAbort ? continuousAbort.signal : null);
          if (continuousTurn && (!continuousActive || turnToken !== continuousToken)) return;
          if (d.ok && d.text) full += d.text;
          else if (!d.ok) throw new Error(d.error || "识别失败");
          if (i + CHUNK >= pcm16.length) break;
        }
        voiceHint.textContent = "";
        const clean = full.trim();
        if (clean) {
          if (continuousTurn) {
            if (isFiller(clean)) {
              voiceHint.textContent = "没听清，请再说一次";
              setTimeout(() => startContinuousListening(turnToken), 350);
              return;
            }
            textEl.value = clean;
            if (!send({ continuous: true })) {
              voiceHint.textContent = "⚠ 服务未连接";
              await stopContinuousMode(false);
            }
          } else if (fromWake) {
            // 唤醒后自动录到的可能只是口水音/环境噪音("嗯""啊"…)。
            // 这种含糊内容别当指令发出去,否则小A 只能"看屏幕"猜你要干嘛(就是它老截屏的原因)。
            // 注意:fromWake 的复位统一放到本函数末尾的 finally,保证"识别为空/异常/口水音"
            // 这些提前 return 的失败路径也一定清零,否则 onWakeTriggered 的 `if (fromWake) return`
            // 会永久拦住,唤醒从此哑掉直到重开面板。
            if (isFiller(clean)) {
              voiceHint.textContent = "没听清,再喊一次小A吧";
              return;
            }
            textEl.value = clean;
            speakNextReply = true; wakeReplyText = ""; send();
          } else {
            // 手动点麦克风:只把识别文字填进输入框,交给用户审阅/编辑后自己发
            textEl.value = clean;
            textEl.focus();
            voiceHint.textContent = "已填入,可修改后点发送";
          }
        } else if (continuousTurn) {
          voiceHint.textContent = "没听清，请再说一次";
          setTimeout(() => startContinuousListening(turnToken), 350);
        } else voiceHint.textContent = "⚠ 没识别到内容";
      } catch (e) {
        if (continuousTurn && (!continuousActive || e.name === "AbortError" || /abort/i.test(e.message))) return;
        voiceHint.textContent = "⚠ 识别失败:" + e.message;
        if (continuousTurn) setTimeout(() => startContinuousListening(turnToken), 700);
      } finally {
        clearTimeout(slowTimer);
        // 无论成功发送、识别为空、口水音还是异常,都复位唤醒标记。否则任一失败路径
        // 漏清零,onWakeTriggered 开头的 `if (fromWake) return` 会永久拦截,唤醒失效。
        fromWake = false;
      }
    }

    // 双模式:轻点=自动模式(说完停顿自动发);长按=按住说话松手发。
    // 关键:用"按下到松开的真实时长"判断长按/轻点,不依赖会被麦克风启动拖慢的定时器。
    let mode = null;            // "auto" | "hold"
    let pressStartTs = 0;
    let released = false;       // 是否在录音就绪前就松手了(说明是轻点)
    const LONG_PRESS = 350;     // 按下超过这么久没松 = 长按

    async function beginRecording() {
      cancelSpeech();
      await startRecording();
      recording = true;
      micBtn.classList.add("listening");
    }

    async function onPressStart(e) {
      e.preventDefault();
      if (continuousActive) {
        if (recording && mode === "continuous") { await finishAuto(); return; }
        if (continuousState === "speaking" || continuousState === "transcribing") {
          if (continuousAbort) continuousAbort.abort();
          cancelSpeech();
          await cancelRecording();
          startContinuousListening(continuousToken);
          return;
        }
        if (continuousState === "thinking" || continuousState === "executing") {
          if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: "stop" }));
          continuousAwaitingReply = false;
          continuousQueued = false;
          setBusy(false);
          startContinuousListening(continuousToken);
          return;
        }
        if (!recording) startContinuousListening(continuousToken);
        return;
      }
      // 已在自动模式录音时,再点一下 = 立即结束发送
      if (recording && mode === "auto") { await finishAuto(); return; }
      if (recording) return;

      pressStartTs = Date.now();
      released = false;
      voiceHint.textContent = "🔴 准备中…";
      try {
        await beginRecording();
      } catch (err) {
        voiceHint.textContent = "⚠ 无法使用麦克风:" + err.message;
        return;
      }
      // 录音就绪。若此时用户已松手(轻点),直接进自动模式;否则看已按住多久
      const held = Date.now() - pressStartTs;
      if (released || held < LONG_PRESS) {
        mode = "auto";
        voiceHint.textContent = "🔴 说吧…说完停一下会自动发送(或再点一下麦克风)";
        startSilenceWatch();
      } else {
        mode = "hold";
        voiceHint.textContent = "🔴 按住说话中…松开就发送";
      }
    }

    async function onPressEnd() {
      released = true;
      if (!recording) return;       // 录音还没起来(轻点),交给 onPressStart 处理
      if (mode === "hold") {
        // 长按松手 -> 结束发送
        recording = false; mode = null;
        micBtn.classList.remove("listening");
        voiceHint.textContent = "";
        await stopRecordingAndSend();
      }
      // 自动模式:松手不结束,靠静音检测自动发送(或再点一下)
    }

    micBtn.addEventListener("mousedown", onPressStart);
    micBtn.addEventListener("mouseup", onPressEnd);
    // 触摸屏支持
    micBtn.addEventListener("touchstart", onPressStart, { passive: false });
    micBtn.addEventListener("touchend", (e) => { e.preventDefault(); onPressEnd(); });

    // ===== 语音唤醒:关 / 云端 / 本地 =====
    const wakeToggle = document.getElementById("wakeToggle");
    // "小A"两个音很短,腾讯云 ASR 常识别成各种同音/近音,尽量都收进来
    const WAKE_WORDS = [
      "小a", "小 a", "晓a", "小爱", "小ai", "小艾", "晓艾", "肖a", "笑a",
      "小啊", "小鸭", "小压", "小雅", "小亚", "hey a", "hi a", "xiaoa",
    ];
    let wakeCtx = null, wakeStream = null, wakeAnalyser = null, wakeProc = null, wakeSrc = null;
    let wakeChunks = [], wakeActive = false, wakeBusy = false, wakeLocalWs = null;

    function isWakeWord(text) {
      const t = (text || "").toLowerCase().replace(/[,。!?、\s]/g, "");
      return WAKE_WORDS.some((w) => t.includes(w.replace(/\s/g, "")));
    }

    // 唤醒后自动录到的"废话/口水音":纯语气词、太短、或就是唤醒词本身,不当指令发。
    function isFiller(text) {
      const t = (text || "").replace(/[,。!?、.\s]/g, "");
      if (t.length <= 1) return true;                       // 太短
      if (/^[嗯啊呃哦噢喂唉哎呀嗨的了吧呢么么哒]+$/.test(t)) return true;  // 纯语气词
      if (isWakeWord(t) && t.length <= 3) return true;      // 只喊了"小A"没说事
      return false;
    }

    // 云端唤醒:持续监听音量,有人声才录一小段发 ASR 查唤醒词(省成本)
    async function startCloudWake() {
      wakeStream = await navigator.mediaDevices.getUserMedia({ audio: {
        echoCancellation: true, noiseSuppression: true, autoGainControl: true,
      } });
      wakeCtx = new (window.AudioContext || window.webkitAudioContext)();
      wakeSrc = wakeCtx.createMediaStreamSource(wakeStream);
      wakeAnalyser = wakeCtx.createAnalyser(); wakeAnalyser.fftSize = 512;
      wakeSrc.connect(wakeAnalyser);
      wakeProc = wakeCtx.createScriptProcessor(4096, 1, 1);
      wakeChunks = [];
      let voiceMs = 0, quietMs = 0, capturing = false, noiseFloor = 2;
      let preroll = [];   // 多留几帧前导,避免"小"字开头被削掉
      const buf = new Uint8Array(wakeAnalyser.fftSize);
      wakeProc.onaudioprocess = (e) => {
        if (!wakeActive || recording) return; // 正在录指令时不抢
        wakeAnalyser.getByteTimeDomainData(buf);
        let peak = 0; for (let i = 0; i < buf.length; i++) peak = Math.max(peak, Math.abs(buf[i] - 128));
        const dt = (4096 / wakeCtx.sampleRate) * 1000;
        const frame = new Float32Array(e.inputBuffer.getChannelData(0));
        if (!capturing) noiseFloor = noiseFloor * .95 + peak * .05;
        const threshold = Math.max(4, Math.min(12, noiseFloor + 4));
        if (peak > threshold) {
          if (!capturing && preroll.length) { wakeChunks.push(...preroll); preroll = []; }
          capturing = true; voiceMs += dt; quietMs = 0;
          wakeChunks.push(frame);
        } else if (!capturing) {
          // 没在说话时,滚动保留约 0.3 秒作为前导
          preroll.push(frame);
          if (preroll.length > 4) preroll.shift();
        } else if (capturing) {
          quietMs += dt;
          wakeChunks.push(frame);
          if (quietMs > 280 && voiceMs > 80 && voiceMs < 3000) {
            const clip = wakeChunks;
            capturing = false; voiceMs = 0; quietMs = 0;
            wakeChunks = [];
            checkWakeClip(clip);
          } else if (voiceMs >= 3000) {
            capturing = false; voiceMs = 0; quietMs = 0; wakeChunks = [];
          }
        }
      };
      wakeSrc.connect(wakeProc); wakeProc.connect(wakeCtx.destination);
    }
    let wakePendingClip = null;
    async function checkWakeClip(chunks) {
      if (!chunks.length) return;
      if (wakeBusy) { wakePendingClip = chunks; return; }
      wakeBusy = true;
      const inRate = wakeCtx.sampleRate;
      let len = chunks.reduce((a, c) => a + c.length, 0);
      const merged = new Float32Array(len);
      let o = 0; for (const c of chunks) { merged.set(c, o); o += c.length; }
      const slowTimer = setTimeout(() => {
        if (wakeActive && !recording) voiceHint.textContent = "👂 唤醒识别网络较慢…仍在监听";
      }, 3000);
      try {
        const wav = encodeWav(floatTo16BitPCM(downsample(merged, inRate, 16000)), 16000);
        const b64 = await blobToBase64(wav);
        const r = await fetch(API + "/api/asr", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ audio: b64, format: "wav" }),
        });
        const d = await r.json();
        // 若这期间用户已把唤醒关了,识别结果就不再触发(修"关了还唤醒"的竞态)
        if (wakeActive && d.ok && isWakeWord(d.text)) onWakeTriggered();
      } catch (_) {}
      finally {
        clearTimeout(slowTimer);
        if (wakeActive && !recording && voiceHint.textContent.includes("网络较慢")) {
          voiceHint.textContent = "👂 唤醒已开启";
        }
        wakeBusy = false;
        const next = wakePendingClip;
        wakePendingClip = null;
        if (next && wakeActive && !recording && !fromWake) checkWakeClip(next);
      }
    }
    let cachedHi = null;   // 按已保存音色复用合成中的请求，避免预加载和首次唤醒互相覆盖。
    let hiAudio = null;    // 独立于回复播放器，录音不会掐断“我在”。
    function voiceSignature(v) {
      return `${v.provider || "tencent"}|${v.voice}|${v.speed}`;
    }
    async function refreshCachedHi() {
      const response = await fetch(API + "/api/current_voice", {
        cache: "no-store", signal: AbortSignal.timeout(5000),
      });
      if (!response.ok) throw new Error("无法读取当前音色");
      const current = await response.json();
      if (typeof current.tts_enabled !== "boolean") throw new Error("语音状态不完整");
      voiceCloud = current.tts_enabled;
      if (!voiceCloud) { cachedHi = null; return null; }
      const signature = voiceSignature(current);
      if (!cachedHi || cachedHi.signature !== signature) {
        cachedHi = { signature, audio: ttsReliable("我在", current.voice) };
      }
      const entry = cachedHi;
      const audio = await entry.audio;
      if (cachedHi !== entry) return null; // 已换音色时丢弃旧请求结果。
      if (!audio) cachedHi = null; // 失败后允许下次重新合成。
      return audio;
    }
    async function playHi() {
      // 唤醒应答只用已保存的云音色；首次等待预加载，失败时提示而不更换声音。
      try {
        const audio = await refreshCachedHi();
        if (audio) {
          // 独立播放器避免指令录音中断“我在”。
          if (hiAudio) { try { hiAudio.pause(); } catch (_) {} }
          hiAudio = new Audio("data:audio/mpeg;base64," + audio);
          await hiAudio.play();
          return;
        }
      } catch (_) {
        voiceHint.textContent = "⚠ 无法确认或合成已设音色，请稍后重试";
        return;
      }
      voiceHint.textContent = voiceCloud
        ? "⚠ 云端语音暂时失败，未切换其他音色"
        : "⚠ 请先在设置中配置并保存语音服务，再使用唤醒应答";
    }
    function onWakeTriggered() {
      if (!wakeActive || fromWake || recording) return;
      voiceHint.textContent = "😊 我在,请说…";
      fromWake = true;          // 标记这轮由唤醒触发:指令自动发 + 回复朗读
      playHi();                 // 按已保存音色说“我在”，已缓存则直接播放
      // 进入指令录音(和"我在"并行,不用等它播完)
      setTimeout(async () => {
        if (recording) return;
        try {
          await beginRecording();
          mode = "auto";
          startSilenceWatch();
        } catch (error) {
          fromWake = false;
          await cancelRecording();
          voiceHint.textContent = "⚠ 无法使用麦克风:" + error.message;
        }
      }, 250);
    }
    function stopCloudWake() {
      try { wakeProc && wakeProc.disconnect(); wakeSrc && wakeSrc.disconnect(); } catch (_) {}
      if (wakeStream) wakeStream.getTracks().forEach((t) => t.stop());
      wakeStream = wakeCtx = wakeAnalyser = wakeProc = wakeSrc = null;
      wakeChunks = []; wakePendingClip = null; wakeBusy = false;
    }

    async function startContinuousListening(token) {
      if (!continuousActive || token !== continuousToken || recording || continuousStarting) return;
      if (!ws || ws.readyState !== WebSocket.OPEN) {
        voiceHint.textContent = "⚠ 服务未连接";
        await stopContinuousMode(false);
        return;
      }
      if (continuousAbort) continuousAbort.abort();
      continuousAbort = new AbortController();
      setContinuousState("preparing");
      voiceHint.textContent = "正在打开麦克风…";
      continuousStarting = true;
      try {
        await beginRecording();
        if (!continuousActive || token !== continuousToken) {
          await cancelRecording();
          return;
        }
        mode = "continuous";
        setContinuousState("listening");
        voiceHint.textContent = "连续对话：请说话";
        startSilenceWatch();
      } catch (error) {
        await stopContinuousMode(true);
        voiceHint.textContent = "⚠ 无法使用麦克风:" + error.message;
      } finally {
        continuousStarting = false;
      }
    }

    async function startContinuousMode() {
      if (continuousActive) return;
      if (!ws || ws.readyState !== WebSocket.OPEN) {
        voiceHint.textContent = "⚠ 服务未连接";
        return;
      }
      continuousActive = true;
      const token = ++continuousToken;
      continuousPausedWake = wakeToggle.checked;
      if (continuousPausedWake) {
        wakeToggle.checked = false;
        wakeActive = false;
        stopCloudWake();
      }
      wakeToggle.disabled = true;
      if (hiAudio) { try { hiAudio.pause(); } catch (_) {} }
      continuousAwaitingReply = false;
      continuousQueued = false;
      setContinuousState("preparing");
      await startContinuousListening(token);
    }

    async function stopContinuousMode(restoreWake = true) {
      if (!continuousActive && continuousState === "off") return;
      continuousActive = false;
      continuousToken++;
      continuousStarting = false;
      continuousAwaitingReply = false;
      continuousQueued = false;
      if (continuousAbort) continuousAbort.abort();
      continuousAbort = null;
      cancelSpeech();
      await cancelRecording();
      setContinuousState("off");
      voiceHint.textContent = "";
      wakeToggle.disabled = false;
      const shouldRestoreWake = continuousPausedWake && restoreWake;
      continuousPausedWake = false;
      if (shouldRestoreWake) {
        wakeToggle.checked = true;
        await wakeToggle.onchange();
      }
    }

    continuousButton.onclick = async () => {
      if (continuousActive) await stopContinuousMode(true);
      else await startContinuousMode();
    };

    wakeToggle.onchange = async () => {
      wakeActive = false; stopCloudWake();
      if (wakeToggle.checked) {
        try {
          await startCloudWake();
          wakeActive = true;
          voiceHint.textContent = "👂 唤醒开启,喊\"小A\"试试";
          // 提前合成固定应答，真正唤醒时直接播放，不再多等一次云端 TTS。
          refreshCachedHi().catch(() => {});
        }
        catch (e) { voiceHint.textContent = "⚠ 开麦失败:" + e.message; wakeToggle.checked = false; }
      } else {
        voiceHint.textContent = "";
      }
    };

    connect();
  </script>
</body>
</html>
