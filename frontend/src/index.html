    function clearDeliveryTimer(delivery) {
      if (delivery && delivery.timer) clearTimeout(delivery.timer);
      if (delivery) delivery.timer = null;
    }

    function finishDelivery(clientId) {
      const delivery = pendingDeliveries.get(String(clientId || ""));
      if (!delivery) return;
      clearDeliveryTimer(delivery);
      pendingDeliveries.delete(delivery.payload.client_id);
    }

    function failDelivery(delivery) {
      clearDeliveryTimer(delivery);
      pendingDeliveries.delete(delivery.payload.client_id);
      setBusy(false);
      statusEl.textContent = "消息未送达";
      addEvent("error", "这条消息连续 5 次没有收到服务确认，已停止自动补发。连接正常后请再发送一次。内容仍保留在上方对话中。");
    }

    function scheduleDeliveryRetry(delivery) {
      clearDeliveryTimer(delivery);
      if (delivery.acked) return;
      const delayIndex = Math.max(0, Math.min(delivery.attempts - 1, DELIVERY_RETRY_DELAYS.length - 1));
      const delay = DELIVERY_RETRY_DELAYS[delayIndex];
      delivery.timer = setTimeout(() => {
        if (delivery.acked) return;
        if (delivery.attempts >= MAX_DELIVERY_ATTEMPTS) {
          failDelivery(delivery);
          return;
        }
        trySendDelivery(delivery);
      }, delay);
    }

    function trySendDelivery(delivery) {
      if (!delivery || delivery.acked || !ws || ws.readyState !== WebSocket.OPEN) return;
      if (delivery.attempts >= MAX_DELIVERY_ATTEMPTS) {
        failDelivery(delivery);
        return;
      }
      try {
        ws.send(JSON.stringify(delivery.payload));
        delivery.attempts += 1;
        scheduleDeliveryRetry(delivery);
      } catch (_) {
        scheduleDeliveryRetry(delivery);
      }
    }

    function flushPendingDeliveries() {
      for (const delivery of pendingDeliveries.values()) {
        delivery.acked = false;
        trySendDelivery(delivery);
      }
    }

    function cancelPendingDeliveries() {
      for (const delivery of pendingDeliveries.values()) clearDeliveryTimer(delivery);
      pendingDeliveries.clear();
    }

    async function connect() {
      if (connecting || (ws && (ws.readyState === WebSocket.CONNECTING || ws.readyState === WebSocket.OPEN))) return;
      connecting = true;
      if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
      let url = WS_URL;
      // file:// 的悬浮球:带上本机 UI 令牌证明身份(浏览器同源版不需要,靠 Host 匹配)。
      // 令牌来自 Electron 主进程读取的本机文件;后端还没起来时取到空串,连上会被拒、
      // 下面的 onclose 会自动重连,后端就绪写好令牌后即可连上。
      if (IS_LOCAL_FILE && window.bridge && typeof bridge.getUiToken === "function") {
        try {
          const t = await bridge.getUiToken();
          if (t) url += "?ui_token=" + encodeURIComponent(t);
        } catch (_) {}
      }
      let socket;
      try { socket = new WebSocket(url); }
      catch (_) {
        connecting = false;
        setConn(false);
        void diagnoseConnection();
        scheduleReconnect();
        return;
      }
      ws = socket;
      connecting = false;
      socket.onopen = () => {
        if (ws !== socket) { socket.close(); return; }
        historyLoaded = false; // Replay authoritative persisted trails after every reconnect.
        refreshHealth();
        setConn(true);
        statusEl.textContent = "";
        connectedOnce = true;
        reconnectDelay = RECONNECT_MIN;   // 连上了,退避计时归零
        startHeartbeat();
        // 稍等旧连接完成清理，再补发所有尚未完成的消息。服务端按 client_id 去重。
        setTimeout(flushPendingDeliveries, 350);
      };
      socket.onclose = () => {
        if (ws !== socket) return;
        ws = null;
        if (window.bridge && window.bridge.setForegroundNotice) window.bridge.setForegroundNotice(false);
        connecting = false;
        setConn(false);
        stopHeartbeat();
        void diagnoseConnection();
        // 断线清理流式状态:否则重连后新回复会接在上一句残句后面,setBusy 也会一直卡"工作中"。
        // finishStreamBubble 把已收到的半截渲染定型(不丢字),再把游标复位。
        finishStreamBubble("");
        if (traceClock) { clearInterval(traceClock); traceClock = null; }
        if (currentTaskCard) currentTaskCard.current.textContent = "连接已断开，正在重连；已接收的过程保留。";
        setBusy(false);
        for (const delivery of pendingDeliveries.values()) {
          clearDeliveryTimer(delivery);
          delivery.acked = false;
        }
        if (continuousActive) stopContinuousMode(false);
        scheduleReconnect();
      };
      socket.onerror = () => { if (ws === socket) setConn(false); };
      socket.onmessage = (e) => {
        if (ws !== socket) return;
        // 一帧坏数据不能静默吞掉整条事件流(尤其别把 done 丢了卡"工作中")。
        let ev;
        try {
          ev = JSON.parse(e.data);
        } catch (err) {
          addEvent("error", "收到一条无法解析的消息,已跳过。");
          return;
        }
        if (ev.type === "foreground_control") {
          if (window.bridge && window.bridge.setForegroundNotice) {
            window.bridge.setForegroundNotice(Boolean(ev.data?.active));
          }
          return;
        }
        if (handleConversationControl(ev)) return;
        const eventConversationId = String(ev.data?.conversation_id || "");
        if (eventConversationId && eventConversationId !== currentConversationId && !["input_ack", "input_done"].includes(ev.type)) {
          const item = conversationStore.get(eventConversationId) || {id: eventConversationId, title: "对话"};
          item.unread = true;
          item.running = ev.type !== "done" && ev.type !== "error" && ev.type !== "stopped";
          conversationStore.set(eventConversationId, item);
          conversationButton.classList.add("has-unread");
          return;
        }
        if (ev.type === "input_ack") {
          const delivery = pendingDeliveries.get(String(ev.data?.client_id || ""));
          if (delivery) {
            delivery.acked = true;
            clearDeliveryTimer(delivery);
            statusEl.textContent = "工作中…";
          }
          return;
        }
        if (ev.type === "input_done") {
          finishDelivery(ev.data?.client_id);
          setBusy(false);
          statusEl.textContent = "";
          historyLoaded = false;
          sendConversationCommand("conversation_select", {conversation_id: currentConversationId});
          return;
        }
        handleEvent(ev);
      };
    }

    window.addEventListener("online", () => { if (!ws || ws.readyState !== WebSocket.OPEN) connect(); });
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden && (!ws || ws.readyState !== WebSocket.OPEN)) connect();
    });

    function startHeartbeat() {
      stopHeartbeat();
      // 每 25s 发个 app 层 ping。后端是 if/elif 结构,未知类型直接忽略,不会报错;
      // 作用是让半开的死连接尽快在 send 时暴露 → 触发 onclose → 走重连。
      heartbeatTimer = setInterval(() => {
        if (ws && ws.readyState === WebSocket.OPEN) {
          try { ws.send(JSON.stringify({ type: "ping" })); } catch (_) {}
        }
      }, 25000);
    }
    function stopHeartbeat() {
      if (heartbeatTimer) { clearInterval(heartbeatTimer); heartbeatTimer = null; }
    }
    setConn(false);

    // 把时间戳(毫秒)格式化成聊天应用那样:今天只显示 时:分,昨天加"昨天",更早显示星期/日期
    function fmtTime(ms) {
      const d = new Date(ms), now = new Date();
      const hm = String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
      const day0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const that0 = new Date(d.getFullYear(), d.getMonth(), d.getDate());
      const diff = Math.round((day0 - that0) / 86400000);
      if (diff <= 0) return hm;
      if (diff === 1) return "昨天 " + hm;
      if (diff < 7) return ["周日","周一","周二","周三","周四","周五","周六"][d.getDay()] + " " + hm;
      return (d.getMonth() + 1) + "月" + d.getDate() + "日 " + hm;
    }

    // 两条消息间隔超过 5 分钟才插一条居中时间(和常见聊天应用一致,不是每条都显示)
    let lastTs = 0;
    function maybeTimeSep(ms) {
      if (!ms) return;
      if (ms - lastTs > 5 * 60 * 1000) {
        const t = document.createElement("div");
        t.className = "timesep";
        t.textContent = fmtTime(ms);
        log.appendChild(t);
      }
      lastTs = ms;
    }

    // 轻量 markdown 渲染:先转义 HTML(防注入),再把常见标记变成真样式,
    // 这样 **加粗** 显示成粗体而不是露出星号,满屏 ** 的问题就没了。
    function _escapeHtmlText(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // 关键:先把代码块和行内 code 整段摘出来占位,只对"非代码"文本跑 markdown 规则,
    // 最后把代码原样(仅 HTML 转义)回填。这样代码里的 # * - 不会被当 markdown 破坏。
    // 所有内容(含代码)都先经 HTML 转义,杜绝 XSS(模型输出/工具结果/消息原文都不可信)。
    const LOCAL_DOCUMENT_EXT = "(?:docx?|xlsx?|pptx?|pdf|txt|md|csv|tsv|rtf|odt|ods|odp|png|jpe?g|gif|webp|bmp|tiff?|svg|dwg|dxf|mp3|wav|m4a|mp4)";
    function renderLocalFilePath(value) {
      if (!window.bridge?.openLocalFile || !/^[A-Za-z]:[\\/]/.test(value) || /[<>"|?*\r\n\x00-\x1f]/.test(value) || !new RegExp("\\." + LOCAL_DOCUMENT_EXT + "$", "i").test(value)) return null;
      const label = window.XiaoALanguage?.translate("打开文件") || "打开文件";
      return `<a class="local-file-link" href="#" data-local-path="${escapeHtml(value)}" title="${escapeHtml(label)}"><code>${_escapeHtmlText(value)}</code></a>`;
    }
    log.addEventListener("click", async event => {
      const link = event.target.closest(".local-file-link");
      if (!link) return;
      event.preventDefault();
      if (link.getAttribute("aria-busy") === "true") return;
      link.setAttribute("aria-busy", "true");
      const oldError = link.nextElementSibling;
      if (oldError?.classList.contains("local-file-error")) oldError.remove();
      try {
        const result = await window.bridge.openLocalFile(link.dataset.localPath);
        if (!result?.ok) throw new Error(result?.error || "无法打开文件，请确认文件仍在原位置。");
      } catch (error) {
        const message = document.createElement("span");
        message.className = "local-file-error";
        message.setAttribute("role", "alert");
        const detail = String(error.message || "无法打开文件，请确认文件仍在原位置。");
        message.textContent = window.XiaoALanguage?.translate(detail) || detail;
        link.after(message);
      } finally {
        link.removeAttribute("aria-busy");
      }
    });

    function renderMarkdown(text) {
      const blocks = [];
      let s = String(text || "");
      // 1) 先抽出围栏代码块 ```...```(占位符不含会被后续规则命中的字符)
      s = s.replace(/```([\s\S]*?)```/g, (_, code) => {
        const i = blocks.length;
        blocks.push(`<pre class="code">${_escapeHtmlText(code.replace(/^\n/, "").replace(/\n$/, ""))}</pre>`);
        return `XIAOACODEPLACEHOLDER${i}END`;
      });
      // 2) 再抽出行内 `code`
      s = s.replace(/`([^`\n]+)`/g, (_, code) => {
        const i = blocks.length;
        blocks.push(renderLocalFilePath(code) || `<code>${_escapeHtmlText(code)}</code>`);
        return `XIAOACODEPLACEHOLDER${i}END`;
      });
      s = s.replace(/^(?:[ \t]*)([A-Za-z]:[\\/][^\r\n]+?)[ \t]*$/gm, (line, filePath) => {
        const link = renderLocalFilePath(filePath);
        if (!link) return line;
        const i = blocks.length;
        blocks.push(link);
        return `XIAOACODEPLACEHOLDER${i}END`;
      });
      if (window.XiaoAMath) s = window.XiaoAMath.replace(s, markup => {
        const i = blocks.length;
        blocks.push(markup);
        return `XIAOACODEPLACEHOLDER${i}END`;
      });
      // 3) 对剩余文本做 HTML 转义 + markdown 行内规则
      s = _escapeHtmlText(s);
      s = s.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/__([^_]+)__/g, "<b>$1</b>");
      s = s.replace(/^#{1,6}\s*(.+)$/gm, "<b>$1</b>");
      s = s.replace(/^\s*[-*]\s+/gm, "· ").replace(/^\s*(\d+)\.\s+/gm, "$1. ");
      if (window.XiaoAMarkdownTable) s = window.XiaoAMarkdownTable.render(s);
      s = s.replace(/\n/g, "<br>");
      // 4) 回填代码(占位符本身不含 markdown 字符,不会被上面的规则动到)
      s = s.replace(/XIAOACODEPLACEHOLDER(\d+)END/g, (_, i) => blocks[Number(i)] || "");
      return s;
    }

    // 流式期间用:把"句尾还没闭合的 markdown 标记"暂时藏起来按纯文本处理,
    // 等它闭合了再渲染,避免用户全程看着裸露的 ** 和 ``` 到收尾才整段跳变。
    function renderMarkdownLive(text) {
      let s = String(text || "");
      // 未闭合的围栏代码块(``` 数量为奇数):补一个收尾让它临时成块,不露裸 ```
      const fences = (s.match(/```/g) || []).length;
      if (fences % 2 === 1) s += "\n```";
      // 未配对的行内反引号:去掉最后一个,避免把大段文字误当 code
      const ticks = (s.match(/`/g) || []).length;
      if (ticks % 2 === 1) s = s.replace(/`([^`]*)$/, "$1");
      // 未闭合的 **:去掉句尾孤立的 **,先按纯文本
      if (((s.match(/\*\*/g) || []).length) % 2 === 1) s = s.replace(/\*\*(?=[^*]*$)/, "");
      return renderMarkdown(s);
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;")
        .replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }

    function setBubbleContent(el, text) {
      el.innerHTML = renderMarkdown(text);
    }

    async function copyText(text, button) {
      try {
        let copied = false;
        if (navigator.clipboard && window.isSecureContext) {
          try {
            await navigator.clipboard.writeText(text);
            copied = true;
          } catch (_) {}
        }
        if (!copied) {
          const input = document.createElement("textarea");
          input.value = text; input.style.cssText = "position:fixed;left:-9999px;top:0";
          document.body.appendChild(input); input.focus(); input.select();
          copied = document.execCommand("copy");
          input.remove();
        }
        if (!copied) throw new Error("copy failed");
        button.dataset.state = "copied";
        button.title = "已复制";
        button.setAttribute("aria-label", "已复制");
        setTimeout(() => {
          if (button.isConnected) {
            button.dataset.state = "";
            button.title = button.dataset.copyLabel || "复制小A回复";
            button.setAttribute("aria-label", button.dataset.copyLabel || "复制小A回复");
          }
        }, 1200);
      } catch (_) {
        button.dataset.state = "error";
        button.title = "复制失败";
        button.setAttribute("aria-label", "复制失败");
        setTimeout(() => {
          if (button.isConnected) {
            button.dataset.state = "";
          button.title = button.dataset.copyLabel || "复制小A回复";
          button.setAttribute("aria-label", button.dataset.copyLabel || "复制小A回复");
          }
        }, 1200);
      }
    }

    function addCopyAction(bubble, text, role = "assistant") {
      const actions = document.createElement("div");
      actions.className = "bubble-actions";
      const button = document.createElement("button");
      button.className = "bubble-copy";
      button.type = "button";
      const label = role === "user" ? "复制这条消息" : "复制小A回复";
      button.dataset.copyLabel = label;
      button.title = label;
      button.setAttribute("aria-label", label);
      button.innerHTML = `<svg viewBox="0 0 20 20" aria-hidden="true" focusable="false">
        <rect x="6.25" y="6.25" width="9.5" height="10" rx="1.5"></rect>
        <path d="M13.25 6.25V4.75A1.5 1.5 0 0 0 11.75 3.25h-6.5a1.5 1.5 0 0 0-1.5 1.5v8.5a1.5 1.5 0 0 0 1.5 1.5h1"></path>
      </svg>`;
      button.onclick = () => copyText(String(text || ""), button);
      actions.appendChild(button);
      bubble.appendChild(actions);
    }

    function addBubble(role, text, ts, attachments = []) {
      maybeTimeSep(ts || Date.now());
      const wrap = document.createElement("div");
      wrap.className = "msg " + role;
      wrap.innerHTML = `<div class="bubble"></div>`;
      const b = wrap.querySelector(".bubble");
      // 用户说的话原样显示(纯文本);小A 的回复渲染 markdown
      if (role === "assistant") {
        setBubbleContent(b, text);
        addCopyAction(b, text, role);
      }
      else {
        const visibleText = attachments.length
          ? String(text || "").replace(/\n?\[附件：[^\]]+\]\s*$/, "")
          : String(text || "");
        if (visibleText) {
          const content = document.createElement("div");
          content.textContent = visibleText;
          b.appendChild(content);
          addCopyAction(b, visibleText, role);
        }
      }
      appendAttachments(b, attachments);
      log.appendChild(wrap);
      if (role === "user" || !messageNavigator.isBrowsing()) scrollToBottom();
      else updateScrollToBottomButton();
      return wrap;
    }

    function appendAttachments(bubble, attachments) {
      if (!attachments.length) return;
      let list = bubble.querySelector(".message-attachments");
      if (!list) {
        list = document.createElement("div");
        list.className = "message-attachments";
        bubble.appendChild(list);
      }
      for (const attachment of attachments) {
        const type = String(attachment.type || "");
        const src = attachment.data || attachment.data_url ||
          (attachment.saved_name ? `${API}/api/attachments/${encodeURIComponent(attachment.saved_name)}` : "");
        if (type.startsWith("image/") && src) {
          const img = document.createElement("img");
          img.className = "message-image";
          img.src = src;
          img.alt = String(attachment.name || "图片");
          img.onclick = () => showImageOverlay(img.src);
          img.addEventListener("load", scrollIfNear, {once: true});
          list.appendChild(img);
        } else if (src) {
          const file = document.createElement("a");
          file.className = "message-file";
          file.href = src;
          file.target = "_blank";
          file.rel = "noopener";
          file.title = "在文件所在位置打开";
          file.textContent = `附件：${attachment.name || "文件"}`;
          file.onclick = async (event) => {
            if (!window.bridge || !window.bridge.revealPath || !attachment.saved_name) return;
            event.preventDefault();
            try {
              const response = await fetch(`${API}/api/attachments/${encodeURIComponent(attachment.saved_name)}/location`);
              const result = await response.json();
              if (!response.ok || !result.ok) throw new Error(result.error || "附件不存在");
              window.bridge.revealPath(result.path);
            } catch (error) {
              addEvent("error", `打开附件位置失败：${error.message || error}`);
            }
          };
          list.appendChild(file);
        }
      }
    }

    function appendReplyAttachments(attachments) {
      if (!Array.isArray(attachments) || !attachments.length) return;
      const bubbles = log.querySelectorAll(".msg.assistant .bubble");
      const bubble = bubbles[bubbles.length - 1];
      if (bubble) appendAttachments(bubble, attachments);
      else addBubble("assistant", "文件已准备好：", undefined, attachments);
    }

    function isLogNearBottom() {
      return log.scrollHeight - log.scrollTop - log.clientHeight < 80;
    }

    function updateScrollToBottomButton() {
      scrollToBottomBtn.hidden = log.scrollHeight <= log.clientHeight || isLogNearBottom();
    }

    function scrollToBottom(smooth = false) {
      messageNavigator.followLatest();
      if (smooth) log.scrollTo({top: log.scrollHeight, behavior: window.matchMedia("(prefers-reduced-motion: reduce)").matches ? "instant" : "smooth"});
      else log.scrollTop = log.scrollHeight;
      updateScrollToBottomButton();
      if (smooth) return;
      requestAnimationFrame(() => requestAnimationFrame(() => {
        if (!messageNavigator.isBrowsing()) log.scrollTop = log.scrollHeight;
        updateScrollToBottomButton();
      }));
    }

    scrollToBottomBtn.onclick = () => scrollToBottom(true);
    log.addEventListener("scroll", updateScrollToBottomButton, {passive: true});
    window.addEventListener("resize", () => {
      if (!messageNavigator.isBrowsing() && isLogNearBottom()) scrollToBottom();
      else updateScrollToBottomButton();
    });

    if (!IS_LOCAL_FILE && window.visualViewport) {
      const syncVisualViewport = () => {
        // pinch zoom 由浏览器处理，避免放大时反复重排界面。
        if (Math.abs(window.visualViewport.scale - 1) > 0.01) return;
        const nearBottom = !messageNavigator.isBrowsing() && isLogNearBottom();
        document.documentElement.style.setProperty("--app-height", `${window.visualViewport.height}px`);
        document.documentElement.style.setProperty("--app-top", `${window.visualViewport.offsetTop}px`);
        closeComposerMenus();
        if (nearBottom) scrollToBottom();
      };
      window.visualViewport.addEventListener("resize", syncVisualViewport);
      window.visualViewport.addEventListener("scroll", syncVisualViewport);
      syncVisualViewport();
    }

    // 只有当用户已经贴近底部时才自动跟随滚动;他手动往上翻看历史时不打扰。
    function scrollIfNear() {
      if (!messageNavigator.isBrowsing() && isLogNearBottom()) scrollToBottom();
      else updateScrollToBottomButton();
    }

    // Display-only task trails. Native details supply keyboard/touch open and close.
    const taskTraceCards = new Map();
    let currentTaskCard = null;
    let traceClock = null;
    const TRACE_STATES = {running: "正在执行", waiting: "等待确认", completed: "已完成", failed: "执行失败", stopped: "已停止", interrupted: "上次执行中断", limited: "需要继续"};

    function traceDuration(ms) {
      const seconds = Math.max(0, Math.floor(Number(ms || 0) / 1000));
      return seconds < 60 ? `${seconds} 秒` : `${Math.floor(seconds / 60)} 分 ${seconds % 60} 秒`;
    }

    function updateTraceClock() {
      let running = false;
      for (const card of taskTraceCards.values()) {
        if (!card.root.isConnected) continue;
        const active = ["running", "waiting"].includes(card.trace.status);
        running ||= active;
        const ms = active ? Math.max(card.trace.duration_ms || 0, Date.now() - card.trace.started_at) : card.trace.duration_ms;
        card.meta.textContent = `${card.trace.step_count || 0} 次操作 · ${traceDuration(ms)}`;
      }
      if (!running && traceClock) { clearInterval(traceClock); traceClock = null; }
    }

    function resetTaskTraces() {
      if (traceClock) clearInterval(traceClock);
      traceClock = null;
      taskTraceCards.clear(); currentTaskCard = null;
      streamBubble = null; streamText = "";
    }

    function clearTraceLive(card) {
      if (card.liveNode) { card.liveNode.remove(); card.liveNode = null; }
      streamBubble = null; streamText = "";
    }

    function taskLiveBubble() {
      const card = currentTaskCard;
      if (!card || !["running", "waiting"].includes(card.trace.status)) return null;
      if (!card.liveNode) {
        const wrap = document.createElement("div"); wrap.className = "msg assistant trace-live";
        const bubble = document.createElement("div"); bubble.className = "bubble";
        wrap.appendChild(bubble);
        card.messages.appendChild(wrap);
        card.liveNode = wrap;
      }
      return card.liveNode.querySelector(".bubble");
    }

    function showTaskMessage(text) {
      if (!currentTaskCard || !["running", "waiting"].includes(currentTaskCard.trace.status)) return false;
      clearTraceLive(currentTaskCard);
      setBubbleContent(taskLiveBubble(), text);
      scrollIfNear();
      return true;
    }

    function rawReturnView(card, raw) {
      let view = card.rawViews.get(raw.saved_name);
      if (view) return view;
      view = document.createElement("details");
      const summary = document.createElement("summary"); summary.textContent = "查看原始返回内容";
      summary.setAttribute("aria-expanded", "false");
      const note = document.createElement("div"); note.className = "trace-raw-note";
      note.textContent = "敏感信息已脱敏，媒体不保存；超深或超过 200 项的结构已精简。" +
        (raw.truncated ? " 本步返回已截断（每步最多 128 KiB、每任务最多 2 MiB）。" : "");
      const pre = document.createElement("pre"); pre.className = "confirm-args trace-raw"; pre.textContent = "展开后加载。";
      pre.setAttribute("tabindex", "0"); pre.setAttribute("aria-label", "本步骤的脱敏原始返回内容");
      view.append(summary, note, pre);
      let loaded = false, loading = false;
      view.addEventListener("toggle", async () => {
        summary.setAttribute("aria-expanded", String(view.open));
        if (!view.open || loaded || loading) return;
        loading = true; pre.textContent = "正在加载…";
        try {
          const response = await fetch(`${API}/api/attachments/${encodeURIComponent(raw.saved_name)}`);
          if (!response.ok) throw new Error(response.status === 404 ? "记录文件不存在" : "读取失败");
          pre.textContent = (await response.text()) || "（空返回）";
          loaded = true;
        } catch (_) {
          pre.textContent = "原始返回加载失败；请检查连接，收起后重新展开可重试。若文件已删除，则无法恢复。";
        } finally { loading = false; }
      });
      card.rawViews.set(raw.saved_name, view); return view;
    }

    function continueTaskTrace(card) {
      if (card.resumePending || !card.trace.can_resume || taskBusy) return;
      if (!ws || ws.readyState !== 1) {
        card.current.hidden = false; card.current.textContent = "连接尚未恢复，请连接后再继续。"; return;
      }
      try {
        ws.send(JSON.stringify({
          type: "continue_task", conversation_id: card.conversationId,
          task_trace_id: card.trace.id, provider_id: selectedProviderId, model: selectedModel,
        }));
        card.resumePending = true; card.resumeButton.disabled = true;
        card.resumeButton.textContent = "正在恢复断点…";
        setBusy(true); statusEl.textContent = "正在恢复断点…";
      } catch (_) {
        card.current.hidden = false; card.current.textContent = "继续请求发送失败，请检查连接后重试。";
      }
    }

    function updateTaskTrace(trace, options = {}) {
      if (!trace || !trace.id || !Array.isArray(trace.events)) return null;
      let card = taskTraceCards.get(trace.id);
      if (!card) {
        const messages = document.createElement("div");
        const root = document.createElement("section"); root.className = "task-trace";
        const current = document.createElement("div"); current.className = "trace-current";
        current.setAttribute("role", "status"); current.setAttribute("aria-live", "polite");
        const details = document.createElement("details");
        const summary = document.createElement("summary"); summary.setAttribute("aria-expanded", "false");
        const dot = document.createElement("span"); dot.className = "trace-dot"; dot.setAttribute("aria-hidden", "true");
        const title = document.createElement("span"); title.className = "trace-title";
        const meta = document.createElement("span"); meta.className = "trace-meta";
        summary.append(dot, title, meta);
        const events = document.createElement("div"); events.className = "trace-events";
        const process = document.createElement("div"); process.className = "trace-events";
        const timings = document.createElement("div"); timings.className = "trace-current";
        const actions = document.createElement("div"); actions.className = "trace-actions"; actions.hidden = true;
        const resumeButton = document.createElement("button"); resumeButton.type = "button"; resumeButton.textContent = "继续中断任务";
        actions.appendChild(resumeButton);
        details.append(summary, timings, events, process); root.append(details, current, actions); log.append(messages, root);
        details.addEventListener("toggle", () => summary.setAttribute("aria-expanded", String(details.open)));
        card = {root, messages, messageKey: "[]", current, details, title, meta, timings, events, process, actions, resumeButton, trace,
          conversationId: trace.conversation_id || currentConversationId, rawViews: new Map(),
          resumePending: false, liveNode: null, resultShown: false};
        resumeButton.onclick = () => continueTaskTrace(card);
        taskTraceCards.set(trace.id, card);
      }
      const wasActive = ["running", "waiting"].includes(card.trace.status);
      card.trace = trace;
      card.timings.textContent = [
        trace.llm_ms != null ? `模型等待 ${traceDuration(trace.llm_ms)}` : "",
        trace.tool_ms != null ? `工具执行 ${traceDuration(trace.tool_ms)}` : "",
      ].filter(Boolean).join(" · ");
      card.timings.hidden = !card.timings.textContent;
      card.root.dataset.status = trace.status;
      const active = ["running", "waiting"].includes(trace.status);
      card.title.textContent = `${TRACE_STATES[trace.status] || "任务记录"} · ${trace.has_tools ? "执行过程" : "回复过程"}`;
      const current = TOOL_LABEL[trace.current] || trace.current || "正在等待回复";
      card.current.textContent = active ? `当前：${current}` : trace.status === "failed" ? "本次执行未完成，可展开查看错误。" : trace.status === "interrupted" ? "上次未正常结束，已保存的步骤仍可查看。" : "";
      if (!active && ["stopped", "interrupted", "failed", "limited"].includes(trace.status)) {
        card.current.textContent += trace.can_resume ? (trace.resume_persisted === false ? " 断点仅在内存中，退出后可能丢失；请检查磁盘空间和权限。" : " 已保存有效断点，可继续。") : " 没有有效断点；不会从头重复执行。";
      }
      card.current.hidden = !card.current.textContent;
      card.resumePending = false;
      card.actions.hidden = !trace.can_resume || active;
      card.resumeButton.disabled = active;
      card.resumeButton.textContent = "继续中断任务";
      const savedReturns = new Set(trace.events.map(item => item.raw_return?.saved_name).filter(Boolean));
      for (const name of card.rawViews.keys()) if (!savedReturns.has(name)) card.rawViews.delete(name);
      // Assistant dialogue stays visible; only execution details belong in the disclosure.
      const messages = trace.events.filter(item => item.kind === "message");
      const messageKey = JSON.stringify(messages);
      if (messageKey !== card.messageKey) {
        clearTraceLive(card);
        card.messages.replaceChildren();
        for (const item of messages) {
          const wrap = document.createElement("div"); wrap.className = "msg assistant";
          const bubble = document.createElement("div"); bubble.className = "bubble";
          setBubbleContent(bubble, item.text);
          addCopyAction(bubble, item.text, "assistant");
          wrap.appendChild(bubble); card.messages.appendChild(wrap);
        }
        card.messageKey = messageKey;
      }
      card.events.replaceChildren();
      if (trace.omitted) {
        const omitted = document.createElement("div"); omitted.className = "trace-entry";
        omitted.textContent = `更早的 ${trace.omitted} 条过程记录已精简，以下保留最近记录。`;
        card.events.appendChild(omitted);
      }
      for (const item of trace.events) {
        if (item.kind === "message") continue;
        const entry = document.createElement("div"); entry.className = `trace-entry ${item.kind}`;
        if (item.kind === "tool") {
          entry.dataset.status = item.status;
          const states = {done: "✓", skipped: "已跳过", failed: "失败", running: "执行中", waiting: "待确认", stopped: "已停止", interrupted: "已中断"};
          entry.textContent = `${item.step ? `第 ${item.step} 步 · ` : ""}${states[item.status] || "操作"} · ${TOOL_LABEL[item.name] || item.name}`;
          if (item.tool_ms != null) entry.textContent += ` · ${traceDuration(item.tool_ms)}`;
          if (item.hint || item.summary) {
            const hint = document.createElement("div"); hint.className = "trace-hint";
            hint.textContent = item.summary || item.hint; entry.appendChild(hint);
          }
          if (item.raw_return?.saved_name) entry.appendChild(rawReturnView(card, item.raw_return));
          else if (item.raw_return?.error || ["done", "failed"].includes(item.status)) {
            const missing = document.createElement("div"); missing.className = "trace-hint";
            missing.textContent = item.raw_return?.error || "此旧步骤未保存原始返回内容。"; entry.appendChild(missing);
          }
          if (item.detail) {
            const detail = document.createElement("details"); const summary = document.createElement("summary"); summary.textContent = "查看错误详情";
            const pre = document.createElement("pre"); pre.className = "confirm-args"; pre.textContent = item.detail;
            detail.append(summary, pre); entry.appendChild(detail);
          }
        } else entry.textContent = item.text || "";
        card.events.appendChild(entry);
      }
      card.root.hidden = trace.status === "completed" && !trace.has_tools && !trace.events.length && !trace.omitted;
      if (active) {
        currentTaskCard = card;
        if (!traceClock) traceClock = setInterval(updateTraceClock, 1000);
      } else {
        if (card.liveNode && !options.finalReply) {
          // Keep an interrupted partial reply when no completed message was saved.
          finishStreamBubble();
          card.liveNode = null;
        } else clearTraceLive(card);
        if (wasActive) card.details.open = false;
        if (currentTaskCard === card) currentTaskCard = null;
        if (options.finalReply && !card.resultShown) {
          const result = addBubble("assistant", options.finalReply, options.ts, options.attachments || []);
          if (result) card.root.after(result);
          card.resultShown = true;
        } else if (options.attachments?.length && !card.resultShown) {
          const result = addBubble("assistant", "文件已准备好：", options.ts, options.attachments);
          if (result) card.root.after(result);
          card.resultShown = true;
        }
      }
      updateTraceClock(); scrollIfNear(); return card;
    }

    // ===== 流式回复:文字一片片到,追加进同一个气泡 =====
    let streamBubble = null;   // 当前正在写的气泡元素
    let streamText = "";       // 已累积的文字
    let streamRenderPending = false;   // rAF 节流:一帧最多渲染一次

    function appendToStreamBubble(delta) {
      if (!streamBubble) {
        streamBubble = taskLiveBubble();
        if (!streamBubble) {
          maybeTimeSep(Date.now());
          const wrap = document.createElement("div"); wrap.className = "msg assistant";
          wrap.innerHTML = `<div class="bubble"></div>`; log.appendChild(wrap);
          streamBubble = wrap.querySelector(".bubble");
        }
        streamText = "";
      }
      streamText += delta;
      // 边流边渲染 markdown,但句尾未闭合的标记先按纯文本(renderMarkdownLive),
      // 不再让用户全程盯着裸露的 ** 和 ```;用 rAF 节流,避免每个分片都重排卡顿。
      if (!streamRenderPending) {
        streamRenderPending = true;
        requestAnimationFrame(() => {
          streamRenderPending = false;
          if (streamBubble) {
            streamBubble.innerHTML = renderMarkdownLive(streamText);
            scrollIfNear();
          }
        });
      }
    }

    // 收尾:返回完整文本(供朗读用)。full 是后端给的完整内容,以它为准更可靠。
    function finishStreamBubble(full) {
      const text = full || streamText;
      if (streamBubble) {
        setBubbleContent(streamBubble, text);
        addCopyAction(streamBubble, text, "assistant");
      }
      streamBubble = null; streamText = "";
      return text;
    }

    function addEvent(cls, text, detail = "") {
      const d = document.createElement("div");
      d.className = "event " + cls;
      d.textContent = text;
      if (detail) {
        const details = document.createElement("details");
        const summary = document.createElement("summary");
        summary.textContent = "查看原始结果";
        const pre = document.createElement("pre");
        pre.className = "confirm-args";
        pre.textContent = detail;
        details.appendChild(summary);
        details.appendChild(pre);
        d.appendChild(details);
      }
      log.appendChild(d);
      scrollIfNear();
    }

    function addToolFailure(data) {
      let result = data.result;
      try { if (typeof result === "string") result = JSON.parse(result); } catch (_) {}
      const structured = result && typeof result === "object" && !Array.isArray(result);
      const sendStatus = structured && ["send_text_to_window", "click_element", "press_hotkey"].includes(data.name);
      const statuses = {
        window_unavailable: "目标窗口当前不可见，未发送；请恢复窗口后再检查。",
        window_not_found: "未找到指定窗口，未发送；请检查已打开的微信窗口，不代表账号未登录。",
        uia_target_not_found: "未找到唯一的目标会话控件，未发送；请检查联系人及当前微信窗口。",
        uia_target_ambiguous: "存在多个目标候选，未发送；请先明确联系人或会话。",
        destination_not_confirmed: "未确认当前会话是指定联系人，未发送；请核对会话标题。",
        sent_unverified: "已执行发送，但尚未核实结果；请查看聊天记录，不要直接重发。",
        previous_send_unconfirmed: "上次发送结果尚未核实，已阻止重复发送；请先检查聊天记录。",
        background_partial: "后台输入已发生，发送结果不确定；已停止后续发送，请核对草稿和聊天记录。",
        input_not_confirmed: "未确认消息输入框，未发送；请重新检查目标窗口。",
      };
      const note = sendStatus ? statuses[result.status] : "";
      const label = TOOL_LABEL[data.name] || data.name || "工具";
      let message = note || (structured && result.error) || String(data.result).slice(0, 200);
      if (structured && result.verification_reason) message += ` ${result.verification_reason}`;
      const warning = sendStatus && ["sent_unverified", "previous_send_unconfirmed", "background_partial"].includes(result.status);
      const detail = structured ? JSON.stringify(result, null, 2) : String(data.result);
      addEvent(warning ? "warning" : "error", `${warning ? "⚠" : "✗"} ${label}：${message}`, detail);
    }

    function addTaskDuration(durationMs) {
      const ms = Number(durationMs);
      if (!Number.isFinite(ms) || ms < 0) return;
      const seconds = ms / 1000;
      const label = seconds < 60
        ? `${seconds < 10 ? seconds.toFixed(1) : Math.round(seconds)} 秒`
        : `${Math.floor(seconds / 60)} 分 ${Math.round(seconds % 60)} 秒`;
      const item = document.createElement("div");
      item.className = "task-duration";
      item.textContent = `本次任务用时 ${label}`;
      log.appendChild(item);
      scrollIfNear();
    }

    // 工具调用显示成一行简洁的步骤条(把工具名翻译成人话)
    const TOOL_LABEL = {
      launch_app: "打开软件", open_url: "默认浏览器打开网页", browser_open: "小A专用浏览器打开网页", focus_window: "切换窗口",
      list_windows: "查找窗口", screen_capture: "看屏幕", screen_capture_region: "查看区域",
      click_element: "点击", click_coordinate: "坐标点击", triple_click: "连续三击", move_pointer: "移动鼠标",
      scroll_screen: "滚动页面", drag_pointer: "拖动", wait_for_screen_change: "等待界面",
      send_text_to_window: "发送到窗口", type_text: "输入文字",
      press_hotkey: "按快捷键", create_word_doc: "新建 Word", create_excel_file: "新建 Excel",
      excel_read_range: "读表格", excel_write_cells: "写表格", excel_read_all: "读表格",
      excel_append_row: "追加一行", word_read_text: "读文档", word_find_replace: "改文档",
      code_read: "读代码", code_write: "写文件", code_edit: "改代码",
      code_apply_edits: "批量改代码", code_search: "搜代码", code_project_instructions: "读取项目规则",
      code_git_status: "检查 Git", code_git_diff: "检查改动", code_git_log: "查看提交",
      code_checkpoint_create: "创建检查点", code_checkpoint_restore: "恢复检查点",
      code_process_start: "启动长命令", code_process_poll: "查看长命令",
      code_process_write: "输入长命令", code_process_stop: "停止长命令",
      code_detect_commands: "识别验证命令", code_verify: "验证代码", code_run: "运行",
      extension_search: "搜索扩展", extension_inspect: "检查扩展", extension_install: "安装扩展",
      extension_update: "更新扩展", extension_list: "查看扩展", extension_enable: "启停扩展",
      extension_rollback: "回滚扩展", run_command: "执行命令",
      cloud_exec: "云端运行", cloud_read_file: "读云端文件", cloud_upload: "上传到云端",
      fs_list_dir: "看目录", fs_read_text: "读文件", fs_write_text: "写文件",
      send_file_to_chat: "发文件", send_image_to_chat: "发图片",
    };
    function addStep(name, args) {
      const label = TOOL_LABEL[name] || name;
      // 挑一个最能说明意图的参数值(软件名/网址/文字…)
      const hint = args && typeof args === "object"
        ? (args.name || args.url || args.text || args.command || args.path || "") : "";
      const d = document.createElement("div");
      d.className = "step";
      d.innerHTML = `<span class="ic">⚙</span><span><span class="nm"></span> <span class="ht"></span></span>`;
      d.querySelector(".nm").textContent = label;
      d.querySelector(".ht").textContent = hint ? String(hint).slice(0, 40) : "";
      log.appendChild(d);
      scrollIfNear();
    }

    // 全屏遮罩放大看图,点一下关闭
    function showImageOverlay(src) {
      const ov = document.createElement("div");
      ov.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;" +
        "align-items:center;justify-content:center;z-index:9999;cursor:zoom-out";
      const big = document.createElement("img");
      big.src = src;
      big.style.cssText = "max-width:96%;max-height:96%;border-radius:8px";
      ov.appendChild(big);
      ov.onclick = () => ov.remove();
      document.body.appendChild(ov);
    }

    function addScreenshot(b64) {
      const wrap = document.createElement("div");
      wrap.className = "event";
      wrap.style.padding = "4px";
      const cap = document.createElement("div");
      cap.textContent = "📷 小A看到的屏幕:";
      cap.style.marginBottom = "4px";
      const img = document.createElement("img");
      img.className = "message-image";
      img.src = "data:image/jpeg;base64," + b64;
      cap.textContent = "📷 小A看到的屏幕(点图放大):";
      // Electron 悬浮球窗太小,点图用系统图片查看器打开(可全屏缩放);浏览器版用弹层放大
      img.onclick = () => {
        if (window.bridge && window.bridge.openImage) window.bridge.openImage(b64);
        else showImageOverlay(img.src);
      };
      wrap.appendChild(cap); wrap.appendChild(img);
      const parent = typeof currentTaskCard !== "undefined" && currentTaskCard ? currentTaskCard.process : log;
      parent.appendChild(wrap);
      scrollIfNear();
    }

    let historyLoaded = false;
    function handleEvent(ev) {
      const d = ev.data || {};
      switch (ev.type) {
        case "history":
          if (d.conversation_id && d.conversation_id !== currentConversationId) break;
          const activeItem = conversationStore.get(currentConversationId);
          if (activeItem) activeItem.unread = false;
          if (!historyLoaded) {
            historyLoaded = true;
            if (typeof resetTaskTraces === "function") resetTaskTraces();
            log.innerHTML = "";
            const hint = document.createElement("div");
            hint.className = "event";
            hint.style.textAlign = "center";
            hint.textContent = "—— 以上是之前的对话 ——";
            for (const m of (Array.isArray(d.messages) ? d.messages : [])) {
              if (m.task_trace) updateTaskTrace(m.task_trace, {finalReply: m.content, ts: m.ts, attachments: m.attachments || []});
              else if (m.role === "user" || m.role === "assistant") addBubble(m.role, m.content, m.ts, m.attachments || []);
            }
            lastTs = 0;
            if (d.messages?.length) log.appendChild(hint);
            scrollToBottom();
            requestAnimationFrame(() => requestAnimationFrame(() => scrollToBottom()));
          }
          break;
        case "task_trace":
          updateTaskTrace(d.trace, {reason: d.reason});
          break;
        case "tool_call":
          setServiceHealthy();
          if (!currentTaskCard) addStep(d.name, d.arguments);
          if (continuousActive && continuousAwaitingReply) setContinuousState("executing");
          break;
        case "tool_result":
          // 结果只在出错时显示;成功的一笔带过(步骤条已经说明在做什么了)。
          // 例外:cad_* 改图工具返回 saved_as/backup/summary,存成哪个格式/备份在哪
          // 对交付图纸是要紧事,这里单独亮出来。
          if (d.skipped || d.interrupted) {
            addEvent("", "已跳过尚未开始的旧操作，按插话调整任务。");
          } else if (!d.ok) {
            addToolFailure(d);
          } else if (!currentTaskCard && d.name && d.name.startsWith("cad_")) {
            try {
              const parsed = typeof d.result === "string" ? JSON.parse(d.result) : d.result;
              if (parsed && typeof parsed === "object") {
                const summary = parsed.summary;
                const savedAs = parsed.saved_as;
                const backup = parsed.backup;
                if (summary) {
                  addEvent("", `💾 ${summary}`);
                } else if (savedAs) {
                  let note = `已保存(${savedAs})`;
                  if (backup) note += `；备份：${backup}`;
                  addEvent("", `💾 ${note}`);
                }
              }
            } catch (e) { /* 非 JSON 结果,忽略 */ }
          }
          if (continuousActive && continuousAwaitingReply) setContinuousState("thinking");
          break;
        case "message":
          setServiceHealthy();
          if (d.content) {
            if (!showTaskMessage(d.content)) addBubble("assistant", d.content);
            if (continuousActive && continuousAwaitingReply) receiveContinuousReply(d.content);
            // 唤醒轮:不立刻念(可能是走工具时的开场白),只记住最新一条,等 done 再念最终答案
            else if (speakNextReply) wakeReplyText = d.content;
          }
          break;
        case "progress":
          // 长任务进度固定显示在左侧胶囊,状态文本继续用于读屏播报。
          // cad_wait 是 AutoCAD 冷启动等待的进度(后端工作线程投回来的人话)。
          if (d.cad_wait) {
            statusEl.textContent = d.cad_wait;
          } else if (Number.isFinite(Number(d.step))) {
            statusEl.textContent = `工作中… 第 ${d.step}/${d.max} 步`;
          }
          if (continuousActive && continuousAwaitingReply) setContinuousState("executing");
          break;
        case "message_delta":
          setServiceHealthy();
          // 流式:逐字追加到同一个气泡里(先出字,感觉快)
          if (d.delta) {
            appendToStreamBubble(d.delta);
            feedStreamSpeech(d.delta, false);
          }
          if (continuousActive && continuousAwaitingReply) setContinuousState("thinking");
          break;
        case "message_end":
          // 收尾未满一句的尾巴；已按完整句排队的内容不会重复朗读。
          {
            const full = finishStreamBubble(d.content || "");
            if (streamSpeech) feedStreamSpeech("", true);
            else if (full && continuousActive && continuousAwaitingReply) receiveContinuousReply(full);
            // 唤醒轮:同 message,只暂存最新正文,不当场念。走工具时这里会先来一条开场白,
            // 最终答案随后再来一条 message_end 覆盖它;done 时念的才是最终答案。
            else if (full && speakNextReply) wakeReplyText = full;
          }
          break;
        case "screenshot":
          if (d.image) addScreenshot(d.image);
          break;
        case "incoming_message":
          if (window.bridge && window.bridge.notifyFloat) window.bridge.notifyFloat("incoming");
          addIncomingMessage(d);
          break;
        case "scheduled_reminder":
          setServiceHealthy();
          if (window.bridge && window.bridge.notifyFloat) window.bridge.notifyFloat("incoming");
          addBubble("assistant", `⏰ 定时提醒${d.name ? `（${d.name}）` : ""}：${d.text || ""}`);
          break;
        case "settings_changed":
          refreshHealth();
          break;
        case "confirm_needed":
          showConfirm(d);
          if (window.bridge && window.bridge.notifyFloat) window.bridge.notifyFloat("approval");
          statusEl.textContent = "等待你确认…";
          if (continuousActive && continuousAwaitingReply) setContinuousState("executing");
          break;
        case "error":
          if (d.where === "llm.config") refreshHealth();
          if (d.where === "task.resume") {
            for (const card of taskTraceCards.values()) {
              if (card.resumePending) { card.resumePending = false; card.resumeButton.disabled = false; card.resumeButton.textContent = "继续中断任务"; }
            }
            if (!currentTaskCard) { setBusy(false); statusEl.textContent = ""; }
          }
          if (d.trace) updateTaskTrace(d.trace);
          if (window.bridge && window.bridge.clearFloatAlert) window.bridge.clearFloatAlert("approval");
          addEvent("error", `错误: ${d.msg || JSON.stringify(d)}`);
          if (d.duration_ms && !d.trace) addTaskDuration(d.duration_ms);
          // 模型配置错误同样会终止本轮；记忆/技能等可恢复错误不结束任务。
          // where 兼容尚未提供 task_finished 的旧后端。
          if (d.task_finished || d.client_id || d.service_failed ||
              d.where === "llm.config" || d.where === "llm.chat") {
            finishDelivery(d.client_id);
            finishStreamBubble("");
            cancelSpeech();
            speakNextReply = false;
            wakeReplyText = "";
            const failed = d.service_failed || d.where === "llm.chat";
            if (failed) setServiceFailed(d.msg);
            setBusy(false);
            statusEl.textContent = failed ? "服务异常" : "";
            if (continuousActive) stopContinuousMode(false);
          }
          break;
        case "queued":
          // 小A 还在忙,你这条已排队(不会丢),做完自动接着做
          addEvent("", `小A 还在忙,这条先排上了(前面还有 ${d.ahead} 条),做完就接着办。`);
          if (continuousActive && continuousAwaitingReply) continuousQueued = true;
          break;
        case "interjected":
          finishDelivery(d.client_id);
          if (d.confirmation_cancelled) {
            document.querySelectorAll(".confirm-box").forEach(box => box.remove());
            if (window.bridge && window.bridge.clearFloatAlert) window.bridge.clearFloatAlert("approval");
          }
          addEvent("", d.confirmation_cancelled
            ? "已插入；刚才等待确认的操作已取消，小A会按新要求继续。"
            : "已收到你的插话，正在切换到新要求；若有操作正在执行，会在安全返回后调整。");
          statusEl.textContent = "已插入新要求…";
          break;
        case "interjection_applied":
          addEvent("", "已采用新的补充要求，保留已完成进度。");
          statusEl.textContent = "正在按插话调整任务";
          break;
        case "dequeued":
          addEvent("", `开始处理排队的:${(d.text || "").slice(0, 30)}`);
          setBusy(true);
          statusEl.textContent = "工作中…";
          if (continuousActive && continuousAwaitingReply) {
            continuousQueued = false;
            setContinuousState("thinking");
          }
          break;
        case "resume_available":
          if (!d.task_trace_id) showContinue("saved", d.summary);
          break;
        case "truncated":
          // 触发执行保护:给个"继续"按钮,点一下从断点接着干(不用重说一遍)
          if (!d.task_trace_id || d.reason === "context_exhausted") showContinue(d.reason, d.summary);
          break;
        case "done":
          if (d.trace) updateTaskTrace(d.trace, {finalReply: d.final_reply, attachments: d.reply_attachments || []});
          else appendReplyAttachments(d.reply_attachments);
          if (window.bridge && window.bridge.clearFloatAlert) window.bridge.clearFloatAlert("approval");
          if (!d.aborted && !d.truncated && window.bridge && window.bridge.notifyFloat) {
            window.bridge.notifyFloat("complete");
          }
          finishDelivery(d.client_id);
          setBusy(false);
          statusEl.textContent = "";   // 任务结束,清掉"工作中…第N步"
          if (!d.trace) addTaskDuration(d.duration_ms);
          if (continuousActive && continuousAwaitingReply && !continuousQueued) {
            continuousTaskDone = true;
            maybeCompleteContinuousReply();
          } else if (speakNextReply) {
            // 唤醒轮真正收尾:此刻 wakeReplyText 已是"最后一条"助手正文(最终答案,
            // 而非走工具时的开场白)。现在才消费 speakNextReply 并朗读。
            speakNextReply = false;
            const reply = wakeReplyText;
            wakeReplyText = "";
            if (reply) speak(reply);
          }
          break;
        case "stopped":
          if (window.bridge && window.bridge.clearFloatAlert) window.bridge.clearFloatAlert("approval");
          cancelSpeech();
          setBusy(false);
          statusEl.textContent = "";
          addEvent("", d.summary
            ? `已停止“${d.summary}”。有有效断点时，可在任务卡内继续；也可以补充纠正要求。`
            : "已停止当前任务。有有效断点时，可在任务卡内继续；也可以补充纠正要求。");
          break;
      }
    }

    // 收到飞书消息:显示对方原文 + 可编辑的草稿 + 发送/忽略
    function addIncomingMessage(d) {
      const box = document.createElement("div");
      box.className = "confirm-box";
      const tag = "飞书";
      box.innerHTML = `
        <div style="font-size:13px"><b>📨 ${tag}${d.is_group ? "群" : ""} · ${escapeHtml(d.conversation || d.sender)}</b>${d.is_group ? `<span style="color:#6b7280"> · ${escapeHtml(d.sender)} 发来</span>` : " 发来"}:</div>
        <div style="background:#fff;border:1px solid #eee;border-radius:8px;padding:8px;margin:6px 0;font-size:13px">${escapeHtml(d.text)}</div>
        <div style="font-size:12px;color:#6b7280;margin-bottom:4px">小A 拟的回复(可改):</div>
        <textarea class="draft" style="width:100%;box-sizing:border-box;border:1px solid #d1d5db;border-radius:8px;padding:8px;font-size:13px;font-family:inherit" rows="3"></textarea>
        <input class="regenerate-hint" placeholder="重拟说明（可要求查个人记忆；工作群不查）" style="width:100%;box-sizing:border-box;border:1px solid #d1d5db;border-radius:8px;padding:7px;font-size:12px;font-family:inherit;margin-top:6px" />
        <div class="acts">
          <button class="btn-regenerate">重拟</button>
          <button class="btn-allow">发送</button>
          <button class="btn-deny">忽略</button>
        </div>`;
      const ta = box.querySelector(".draft");
      const hint = box.querySelector(".regenerate-hint");
      ta.value = d.draft || "";
      box.querySelector(".btn-regenerate").onclick = async () => {
        const button = box.querySelector(".btn-regenerate");
        button.disabled = true;
        try {
          const r = await fetch(API + "/api/reply/regenerate", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ id: d.id, text: hint.value.trim() || ta.value.trim() }),
          });
          const res = await r.json();
          if (res.ok) ta.value = res.draft || "";
          else addEvent("error", `重拟失败:${res.error || "未知错误"}`);
        } catch (e) { addEvent("error", `重拟失败:${e.message}`); }
        button.disabled = false;
      };
      box.querySelector(".btn-allow").onclick = async () => {
        const t = ta.value.trim();
        if (!t) return;
        box.querySelector(".btn-allow").disabled = true;
        try {
          const r = await fetch(API + "/api/reply/send", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ id: d.id, text: t }),
          });
          const res = await r.json();
          if (res.ok) {
            box.innerHTML = `
              <div style="color:#16a34a;font-size:13px">✓ 已回复 ${escapeHtml(d.conversation || d.sender)}</div>
              <div style="margin-top:6px;color:#374151;font-size:13px;white-space:pre-wrap">${escapeHtml(t)}</div>`;
          } else {
            box.textContent = `发送失败:${res.error || ""}`;
            box.style.color = "#dc2626";
            box.style.fontSize = "13px";
          }
        } catch (e) {
          box.textContent = `发送失败:${e.message}`;
          box.style.color = "#dc2626";
          box.style.fontSize = "13px";
        }
      };
      box.querySelector(".btn-deny").onclick = () => {
        fetch(API + "/api/reply/ignore", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id: d.id, text: "" }),
        }).catch(() => {});

      };
      log.appendChild(box);
      scrollIfNear();
    }

    // 触发执行保护:显示"继续"按钮,点一下从断点接着干
    function showContinue(reason, summary = "") {
      const conversationId = currentConversationId;
      const reasonText = {
        context_limit: "上下文已接近模型窗口上限，进度已保存",
        context_exhausted: "上下文需要切换到可容纳更多内容的模型，进度已保存",
        spinning: "检测到连续重复操作，已停止防止原地打转",
        step_limit: "任务达到防无限执行的最终安全上限",
        saved: "发现上次保存的任务断点",
      }[reason] || "任务已暂停并保存断点";

    const CONFIRM_TRUNCATION_NOTICE = "…（已截断，完整内容见日志）";
    function truncateConfirmText(value, limit) {
      const text = String(value ?? "");
      if (text.length <= limit) return text;
      return text.slice(0, Math.max(0, limit - CONFIRM_TRUNCATION_NOTICE.length)) + CONFIRM_TRUNCATION_NOTICE;
    }

    function formatConfirmArguments(args) {
      const serialized = JSON.stringify(args, (_key, value) =>
        typeof value === "string" ? truncateConfirmText(value, 200) : value, 2) ?? "{}";
      return truncateConfirmText(serialized, 2000);
    }

    function showConfirm(d) {
      const conversationId = d.conversation_id || currentConversationId;
      const box = document.createElement("div");
      box.className = "confirm-box";
      const warning = d.reason === "financial" ? "涉及资金，必须由你确认"

        : d.reason === "password" ? "将读取或处理凭据，必须由你确认"
        : d.reason === "service_stop" ? "即将停止云端服务，必须由你确认"
        : d.reason === "delete" ? "将删除指定文件或资源，必须由你确认"
        : d.reason === "uninstall" ? "将卸载指定软件或服务，必须由你确认"
        : d.reason === "overwrite" ? "将覆盖指定文件或配置，必须由你确认"
        : d.reason === "untrusted_prompt" ? "第三方技能会加入小A的系统提示，必须由你确认"
        : d.reason === "external_code" ? "即将安装并启用第三方代码"
        : "即将执行有副作用的操作";
      const scope = Array.isArray(d.approval_scope) ? d.approval_scope : [];
      const taskScope = scope.includes("task");
      const reuse = taskScope
        ? "本次任务只请求一次危险操作授权。允许后，本次任务中你明确要求的资金、凭据访问、敏感信息外发、删除覆盖、停服卸载、第三方代码及技能等操作不再逐项询问；硬性禁令和工具保护仍有效。拒绝后不执行需授权的步骤，重新发送任务后会重新确认。"
        : scope.length ? "本轮同类普通维护操作会复用这次授权。" : "";
      const argumentsJson = formatConfirmArguments(d.arguments);
      box.innerHTML = `<div>${warning}：<b>${escapeHtml(d.name)}</b></div>
        ${reuse ? `<div class="confirm-scope">${reuse}</div>` : ""}
        <pre class="confirm-args">${escapeHtml(argumentsJson)}</pre>
        <div class="acts">
          <button class="btn-allow">${taskScope ? "允许本次任务" : "允许"}</button>
          <button class="btn-deny">${taskScope ? "拒绝本次任务" : "拒绝"}</button>
        </div>`;
      box.querySelector(".btn-allow").onclick = () => {

        box.remove();
      };
      box.querySelector(".btn-deny").onclick = () => {
        ws.send(JSON.stringify({ type: "confirm", allow: false, conversation_id: conversationId }));
        if (window.bridge && window.bridge.clearFloatAlert) window.bridge.clearFloatAlert("approval");
        box.remove();
      };
      log.appendChild(box);
      scrollIfNear();

    function setBusy(busy) {
      const nextBusy = Boolean(busy);
      taskBusy = nextBusy;
      updateActionButton();
    }

    function hasActionInput() {
      return Boolean(textEl.value.trim() || pendingAttachments.length);
    }

    function updateActionButton() {
      const stopping = taskBusy && !hasActionInput();
      sendBtn.classList.toggle("stop-mode", stopping);
      sendBtn.innerHTML = stopping
        ? '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="6" y="6" width="12" height="12" rx="1.5" fill="currentColor" /></svg>'
        : '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 19V5m-6 6 6-6 6 6" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" /></svg>';
      sendBtn.title = stopping ? "停止任务" : taskBusy ? "插入新要求" : "发送";
      sendBtn.setAttribute("aria-label", sendBtn.title);
      sendBtn.disabled = !stopping && !connEl.classList.contains("ok");
    }

    function send(options) {
      const isContinuous = !!(options && options.continuous === true);
      const text = textEl.value.trim();
      // 没内容:静默不发(不打扰)。
      if (!text && !pendingAttachments.length) return false;
      if (!modelsLoaded || !selectedModel || selectedModelUnavailable()) {
        addEvent("warning", modelsLoaded ? "当前对话的模型或接口已不可用，请在底部手动选择模型后再发送。" : "正在加载模型，请稍后再发送。");
        return false;
      }
      rememberConversationModel();
      const attachments = pendingAttachments.map(({name, type, size, data}) => ({name, type, size, data}));
      const displayText = text || "请处理我上传的附件。";
      addBubble("user", displayText, undefined, pendingAttachments);
      const payload = {
        type: "user_input",
        conversation_id: currentConversationId,
        new_conversation: currentConversationId === draftConversationId,
        client_id: newClientId(),
        text,
        attachments,
        provider_id: selectedProviderId,
        model: selectedModel,
        reasoning_effort: getReasoningEffort(),
        response_language: window.XiaoALanguage?.get() === "en" ? "en" : "zh",
        approval_mode: "full",
      };
      const delivery = {payload, attempts: 0, acked: false, timer: null};
      pendingDeliveries.set(payload.client_id, delivery);
      textEl.value = "";
      textEl.style.height = "";
      pendingAttachments = [];
      renderAttachments();
      setBusy(true);
      if (isContinuous) {
        continuousAwaitingReply = true;
        continuousQueued = false;
        continuousTaskDone = false; continuousReplyReady = false; continuousReplyText = "";
        setContinuousState("thinking");
      }
      // 一点发送就立刻显示"工作中…",不用等第一个进度事件回来才亮
      if (ws && ws.readyState === WebSocket.OPEN) {
        statusEl.textContent = "工作中…";
        trySendDelivery(delivery);
      } else {
        statusEl.textContent = "等待连接恢复…";
        voiceHint.textContent = "连接恢复后会自动发送，无需重新输入";
      }
      return true;
    }

    async function stopCurrentTask() {
      cancelPendingDeliveries();
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: "stop" }));
      }
      cancelSpeech();
      speakNextReply = false; wakeReplyText = "";
      if (hiAudio) { try { hiAudio.pause(); hiAudio.currentTime = 0; } catch (_) {} }
      statusEl.textContent = "";
      setBusy(false);
      if (continuousActive) await stopContinuousMode(true);
      else if (recording) await cancelRecording();
      addEvent("", "已停止当前任务。");
    }
    sendBtn.onclick = () => {
      if (taskBusy && !hasActionInput()) return stopCurrentTask();
      return send();
    };

      textEl.style.height = "auto";
      textEl.style.height = `${Math.min(textEl.scrollHeight, 140)}px`;
      updateActionButton();

    textEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey && !e.isComposing
          && !matchMedia("(pointer: coarse)").matches) { e.preventDefault(); send(); }
    });

    const settingsModal = document.getElementById("settingsModal");
