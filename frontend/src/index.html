<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' http://127.0.0.1:1985 ws://127.0.0.1:1985 https: wss:; img-src 'self' data: http://127.0.0.1:1985; media-src 'self' data: blob:; object-src 'none'; base-uri 'none'" />
  <title>小A · AI 办公助手</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f7fb;
      --panel: #ffffff;
      --ink: #172033;
      --ink-soft: #66758a;
      --line: #e3e8f0;
      --brand: #2563eb;
      --brand-soft: #edf3ff;
      --user: #2563eb;
      --warn: #b45309;
      --danger: #c0392b;
      --control: #eef2f7;
      --control-hover: #e4ebf5;
      --code-bg: #f0f4f9;
      --placeholder: #8a98aa;
      --border-strong: #d7e0eb;
      --scrollbar-thumb: #c9d4e2;
      --switch-off: #d9e2ee;
      --switch-thumb: #ffffff;
      --radius: 12px;
      --font: "Segoe UI Variable", "Microsoft YaHei UI", "PingFang SC", "Segoe UI", sans-serif;
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #151a24;
      --panel: #202735;
      --ink: #f3f6fb;
      --ink-soft: #aab6c7;
      --line: #354154;
      --brand-soft: #26324b;
      --user: #2f6fec;
      --warn: #f0a34a;
      --danger: #ef6b5d;
      --control: #2b3545;
      --control-hover: #354256;
      --code-bg: #2b3545;
      --placeholder: #91a0b3;
      --border-strong: #46546a;
      --scrollbar-thumb: #53627a;
      --switch-off: #3b4759;
      --switch-thumb: #eef3fb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: var(--font);
      background: var(--bg); color: var(--ink);
      display: flex; flex-direction: column; height: 100vh;
      font-size: 14px; -webkit-font-smoothing: antialiased;
    }
    /* 无边框桌面窗口的四角留出圆角；最大化时恢复满屏直角。 */
    :root[data-desktop="true"] {
      border-radius: 16px;
      overflow: hidden;
      clip-path: inset(0 round 16px);
      -webkit-clip-path: inset(0 round 16px);
    }
    /* Keep the canvas transparent in STANDARD mode as well; #log/header/footer paint the surfaces. */
    :root[data-desktop="true"] body { background: transparent; border-radius: 16px; overflow: hidden; }
    :root[data-desktop="true"][data-maximized="true"] {
      border-radius: 0;
      clip-path: none;
      -webkit-clip-path: none;
    }
    :root[data-desktop="true"][data-maximized="true"] body { border-radius: 0; }
    header {
      min-height: 58px; padding: 12px 14px 12px 18px; background: var(--panel); border-bottom: 1px solid var(--line);
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      -webkit-app-region: drag;
    }
    /* 品牌区可收缩:窗口太窄时优先让标题省略,而不是把右边按钮/进度挤没 */
    header .brand { display: flex; align-items: center; gap: 12px; flex: 0 1 auto; min-width: 0; }
    header .dot {
      width: 32px; height: 32px; border-radius: 50%; flex: none;
      background: var(--brand); color: #fff; display: flex; align-items: center;
      justify-content: center; font-size: 18px; line-height: 1; font-weight: 700; letter-spacing: 0;
    }
    header .dot span {
      display: block;
      font-size: 24px;
      font-weight: 800;
      line-height: 1;
      transform: translate(1px, -2px);
    }
    /* 标题不换行;窗口太窄时省略(…),把空间让给进度文字和按钮 */
    header .title {
      font-weight: 700; font-size: 15px; letter-spacing: 0;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0;
    }
    #continuousButton {
      -webkit-app-region: no-drag; min-width: 0; height: 30px; padding: 0 7px 0 9px;
      border: 1px solid var(--line); border-radius: 999px; background: var(--control);
      color: var(--ink-soft); display: inline-flex; align-items: center; gap: 7px;
      font-weight: 650; font-size: 13px; white-space: nowrap; cursor: pointer;
    }
    #continuousButton:hover, #continuousButton[aria-pressed="true"] {
      background: var(--brand-soft); border-color: #cddcf7;
    }
    #continuousButton:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
    .continuous-switch { position: relative; width: 30px; height: 16px; border-radius: 999px; background: var(--switch-off); flex: none; transition: .2s; }
    .continuous-switch::before { content: ""; position: absolute; width: 12px; height: 12px; left: 2px; top: 2px; background: var(--switch-thumb); border-radius: 50%; transition: .2s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
    #continuousButton[aria-pressed="true"] { color: var(--ink); }
    #continuousButton[aria-pressed="true"] .continuous-switch { background: var(--brand); }
    #continuousButton[aria-pressed="true"] .continuous-switch::before { transform: translateX(14px); }
    /* 右侧一组按钮:不被压缩,永远靠右 */
    header .right { display: flex; align-items: center; gap: 8px; -webkit-app-region: no-drag; flex: none; }
    /* 任务状态文本 */
    header .status {
      min-width: 0; flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; text-align: center;
      font-size: 11.5px; color: var(--brand); white-space: nowrap; margin: 0 8px;
    }
    /* 状态文本保留给读屏与逻辑判断；操作次数和耗时显示在任务卡内。 */
    header .status {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
    }
    header .status.ok { color: var(--brand); }
    /* 连接指示灯:红=没连上,绿=已连上 */
    header .conn {
      width: 32px; height: 32px; border-radius: 9px; flex: none; margin: 0;
      display: inline-grid; place-items: center; background: transparent; box-shadow: none;
    }
    header .conn::before {
      content: ""; width: 9px; height: 9px; border-radius: 50%;
      background: #d1495b;  /* 默认红 */
      box-shadow: 0 0 0 3px rgba(209,73,91,.15); transition: background .2s, box-shadow .2s;
    }
    header .conn.ok::before { background: #21a366; box-shadow: 0 0 0 3px rgba(33,163,102,.18); }
    header .ico {
      -webkit-app-region: no-drag; cursor: pointer;
      width: 30px; height: 30px; padding: 0; border-radius: 8px; border: none; background: transparent;
      display: flex; align-items: center; justify-content: center; font-size: 15px;
      color: var(--ink-soft); transition: background .15s;
    }
    header .ico:hover { background: var(--brand-soft); }
    #conversationButton {
      position: absolute; z-index: 32; top: 68px; left: 14px; -webkit-app-region: no-drag;
      width: 34px; height: 34px; padding: 0; border: 1px solid var(--line); border-radius: 50%;
      display: grid; place-items: center; background: var(--control); color: var(--ink-soft);
      cursor: pointer; box-shadow: 0 5px 14px rgba(20, 35, 60, .16); transition: background .15s, color .15s, transform .15s;
    }
    #conversationButton:hover { background: var(--control-hover); color: var(--ink); transform: translateY(-1px); }
    #conversationButton:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
    #conversationButton svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; }
    #conversationButton .conversation-badge {
      position: absolute; right: 1px; top: 1px; width: 7px; height: 7px; border-radius: 50%;
      background: var(--brand); box-shadow: 0 0 0 2px var(--control); display: none;
    }
    #conversationButton.has-unread .conversation-badge { display: block; }
    #conversationPanel {
      position: fixed; z-index: 30; top: 64px; left: 12px; width: min(340px, calc(100vw - 24px));
      max-height: min(620px, calc(100vh - 84px)); overflow: hidden; display: flex; flex-direction: column;
      background: var(--panel); border: 1px solid var(--line); border-radius: calc(var(--radius) + 4px);
      box-shadow: 0 16px 40px rgba(20, 35, 60, .2);
    }
    #conversationPanel[hidden] { display: none; }
    #conversationConfirm { width: min(420px, calc(100vw - 40px)); height: min(190px, calc(100vh - 40px)); box-sizing: border-box; padding: 0; font: inherit; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); color: var(--ink); box-shadow: 0 18px 48px rgba(20, 35, 60, .28); }
    #conversationConfirm::backdrop { background: rgba(10, 18, 30, .48); }
    #settingsModal[hidden] { display: none; }
    #settingsModal {
      position: fixed; inset: 0; z-index: 80; display: grid; place-items: center;
      padding: 32px 20px; background: var(--bg);
    }
    .settings-modal-panel {
      width: min(1180px, 100%); height: min(820px, calc(100vh - 64px)); min-height: 420px;
      display: flex; flex-direction: column; overflow: hidden;
      background: var(--panel); border: 1px solid var(--line); border-radius: calc(var(--radius) + 4px);
      box-shadow: 0 22px 60px rgba(20, 35, 60, .28);
    }
    .settings-modal-head {
      flex: none; height: 52px; display: flex; align-items: center; justify-content: space-between;
      gap: 12px; padding: 0 14px 0 20px; border-bottom: 1px solid var(--line);
      background: var(--panel);
    }
    .settings-modal-title { font-size: 15px; font-weight: 700; color: var(--ink); }
    #closeSettingsModal {
      width: 40px; height: 40px; padding: 0; border: 0; border-radius: 8px;
      display: grid; place-items: center; -webkit-app-region: no-drag; touch-action: manipulation;
      background: transparent; color: var(--ink-soft); cursor: pointer; font: inherit; font-size: 24px; line-height: 1;
    }
    #closeSettingsModal:hover { background: var(--brand-soft); color: var(--ink); }
    #closeSettingsModal:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
    #settingsFrame { flex: 1 1 auto; width: 100%; min-height: 0; border: 0; background: var(--bg); }
    body.settings-modal-open { overflow: hidden; }
    @media (max-width: 760px) {
      #settingsModal { padding: 12px; }
      .settings-modal-panel { height: calc(100vh - 24px); min-height: 360px; border-radius: var(--radius); }
      .settings-modal-head { height: 48px; padding-left: 16px; }
    }
    .conversation-confirm-content { height: 100%; box-sizing: border-box; display: flex; flex-direction: column; padding: 20px; }
    .conversation-confirm-content strong { font-size: 15px; }
    .conversation-confirm-content p { flex: 1; min-height: 48px; margin: 12px 0 20px; color: var(--ink-soft); line-height: 1.6; overflow-wrap: anywhere; }
    .conversation-confirm-actions { display: flex; justify-content: flex-end; gap: 8px; }
    .conversation-confirm-actions button { min-width: 76px; height: 34px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--control); color: var(--ink); cursor: pointer; font: inherit; }
    .conversation-confirm-actions button:hover { background: var(--control-hover); }
    .conversation-confirm-actions button.danger { border-color: var(--danger); background: var(--danger); color: #fff; }
    .conversation-confirm-actions button.danger:hover { filter: brightness(.94); }
    .conversation-panel-head { box-sizing: border-box; height: 42px; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 2px 14px 2px 48px; border-bottom: 1px solid var(--line); }
    .conversation-panel-title { font-size: 14px; font-weight: 650; }
    .conversation-panel-actions { display: flex; gap: 2px; }
    .conversation-panel-actions button, .conversation-item-action {
      box-sizing: border-box; width: 26px; min-width: 26px; padding: 0;
      border: 0; background: transparent; color: var(--ink-soft); cursor: pointer; border-radius: 8px;
      height: 32px; display: grid; place-items: center; font-size: 18px; line-height: 1;
    }
    .conversation-panel-actions button:hover, .conversation-item-action:hover { background: var(--brand-soft); color: var(--brand); }
    .conversation-panel-actions button { height: 36px; font-size: 21px; }
    #conversationList { padding: 7px; overflow-y: auto; }
    .conversation-empty { padding: 20px 12px; text-align: center; color: var(--ink-soft); font-size: 12px; }
    .conversation-item { box-sizing: border-box; height: 42px; display: flex; align-items: center; gap: 7px; padding: 3px 7px; border-radius: 10px; cursor: pointer; }
    .conversation-item:hover { background: var(--control); }
    .conversation-item.active { background: var(--brand-soft); }
    .conversation-item-main { min-width: 0; flex: 1; }
    .conversation-rename-input {
      width: 100%; min-width: 0; height: 26px; padding: 2px 7px;
      border: 1px solid var(--brand); border-radius: 7px; background: var(--control);
      color: var(--ink); font: inherit; font-size: 13px; outline: none;
    }
    .conversation-item-title { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .conversation-item-title::before { content: ""; flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--line); }
    .conversation-item.running .conversation-item-title::before { background: var(--brand); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 18%, transparent); }
    .conversation-item.unread .conversation-item-title::before { background: var(--warn); }
    .conversation-item-action { height: 26px; font-size: 16px; }
    .conversation-item-actions { display: flex; gap: 2px; flex: none; }
    .conversation-item-action.delete { color: var(--danger); }
    .window-icon { position: relative; width: 13px; height: 13px; display: block; }
    .window-icon::before, .window-icon::after {
      content: ""; position: absolute; width: 8px; height: 8px;
      border: 1px solid currentColor; border-radius: 1px;
    }
    .window-icon::before { display: none; left: 3px; top: 1px; }
    .window-icon::after { left: 2px; top: 2px; }
    #windowToggle[data-maximized="true"] .window-icon::before { display: block; }
    #windowToggle[data-maximized="true"] .window-icon::after { left: 1px; top: 4px; }
    :is(#themeToggle, #languageToggle) { display: grid; place-items: center; border-radius: 50%; background: var(--control); font-size: 17px; line-height: 1; }
    :is(#themeToggle, #languageToggle):hover { background: var(--control-hover); }

    #languageToggle { font-size: 13px; font-weight: 650; flex: none; }
    :is(#themeToggle, #languageToggle):focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

    #log { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 24px 20px 28px; }
    #log::-webkit-scrollbar, .md-table-wrap::-webkit-scrollbar { width: 8px; height: 8px; }
    #log::-webkit-scrollbar-track, .md-table-wrap::-webkit-scrollbar-track { background: transparent; }
    #log::-webkit-scrollbar-thumb, .md-table-wrap::-webkit-scrollbar-thumb {
      background: var(--scrollbar-thumb); border-radius: 4px;
    }
    #log::-webkit-scrollbar-corner { background: var(--bg); }
    .md-table-wrap::-webkit-scrollbar-corner { background: var(--panel); }

    .msg { margin-bottom: 30px; max-width: 82%; display: flex; }
    .msg.user { margin-left: auto; justify-content: flex-end; }
    .bubble {
      position: relative;
      padding: 11px 15px; border-radius: var(--radius); font-size: 14px; line-height: 1.65;
      min-width: 0; max-width: 100%; white-space: pre-wrap; word-break: break-word;
      box-shadow: 0 1px 2px rgba(28,52,84,.04);
    }
    .user .bubble { background: var(--user); color: #fff; border-bottom-right-radius: 4px; }
    .assistant .bubble { background: var(--panel); border: 1px solid var(--line); border-bottom-left-radius: 4px; box-shadow: 0 2px 8px rgba(28,52,84,.04); }
    .message-attachments { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 7px; margin-top: 7px; }
    .message-image {
      display: block; width: 170px; max-width: 100%; max-height: 220px; height: auto; object-fit: contain;
      border-radius: 8px; background: #f1f0ed; cursor: zoom-in;
    }
    .message-file {
      max-width: 100%; padding: 6px 9px; border-radius: 7px; background: rgba(255,255,255,.16);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px;
    }
    .bubble b { font-weight: 650; }
    .bubble code, .trace-entry code {
      background: var(--code-bg); border-radius: 4px; padding: 1px 5px;
      font-family: ui-monospace, "Cascadia Code", monospace; font-size: 12.5px;
    }
    .local-file-link { color: var(--brand); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; overflow-wrap: anywhere; }
    .local-file-link:hover { color: var(--ink); }
    .local-file-link:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 4px; }
    .local-file-link[aria-busy="true"] { cursor: progress; }
    .local-file-error { display: block; color: var(--danger); font-size: 12px; margin-top: 4px; }
    .chat-math { display: inline-block; max-width: 100%; overflow-x: auto; vertical-align: middle; color: inherit; }
    .chat-math math { font-size: 1em; }
    .chat-math-display { display: block; margin: 6px 0; }
    .bubble pre.code, .trace-entry pre.code {
      background: var(--code-bg); border-radius: 8px; padding: 10px 12px; margin: 6px 0;
      font-family: ui-monospace, monospace; font-size: 12.5px; overflow-x: auto;
      white-space: pre-wrap; word-break: break-word;
    }
    .md-table-wrap {
      max-width: 100%; margin: 8px 0; overflow-x: auto; white-space: normal;
      border: 1px solid var(--line); border-radius: 8px;
    }
    .md-table { width: 100%; min-width: max-content; border-collapse: collapse; background: var(--panel); }
    .md-table th, .md-table td {
      padding: 7px 10px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line);
      vertical-align: top; white-space: normal;
    }
    .md-table th:last-child, .md-table td:last-child { border-right: none; }
    .md-table tbody tr:last-child td { border-bottom: none; }
    .md-table th { background: var(--code-bg); font-weight: 650; }
    .md-table .align-center { text-align: center; }
    .md-table .align-right { text-align: right; }
    .task-duration {
      text-align: left; font-size: 11.5px; color: #9a978f; margin: 4px 0 12px 2px;
    }
    .bubble-actions {
      position: absolute; z-index: 1; left: 0; top: 100%; padding-top: 2px;
      display: flex; justify-content: flex-start;
      opacity: 0; pointer-events: none; transition: opacity .15s;
    }
    .msg.user .bubble-actions { left: auto; right: 0; }
    .bubble:hover .bubble-actions, .bubble:focus-within .bubble-actions {
      opacity: 1; pointer-events: auto;
    }
    .bubble-copy {
      display: grid; place-items: center; width: 28px; height: 28px; padding: 0;
      border: 0; border-radius: 50%; background: transparent; color: var(--ink-soft);
      cursor: pointer; transition: background .15s, color .15s; transform: none;
    }
    .bubble-copy svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .bubble-copy:hover { background: var(--control-hover); color: var(--ink); }
    .bubble-copy[data-state="copied"] { color: var(--brand); }
    .bubble-copy[data-state="error"] { color: var(--danger); }
    .bubble-copy:focus-visible { outline: 2px solid var(--brand); outline-offset: 1px; }

    /* 工具调用:折叠成一行低调的"步骤条",不再是大块 monospace */
    .step {
      display: flex; align-items: center; gap: 8px; margin: 5px 0 5px 2px;
      font-size: 12.5px; color: var(--ink-soft);
    }
    .step .ic { width: 16px; text-align: center; flex: none; }
    .step .nm { color: var(--ink); font-weight: 550; }
    .step.err { color: var(--danger); }
    .event {
      font-size: 12.5px; color: var(--ink-soft); margin: 6px 0; padding-left: 24px;
    }
    /* One compact durable trail per turn, using existing theme tokens. */
    .task-trace { margin: 8px 0; border: 0; background: transparent; }
    .task-trace[hidden] { display: none; }
    .task-trace summary { display: flex; align-items: center; gap: 8px; padding: 11px 13px; cursor: pointer; list-style: none; font-size: 13px; }
    .task-trace summary::-webkit-details-marker { display: none; }
    .task-trace summary::before { content: "›"; color: var(--ink-soft); transition: transform .15s; }
    .task-trace details[open] > summary::before { transform: rotate(90deg); }
    .task-trace summary:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: var(--radius); }
    .trace-dot { width: 8px; height: 8px; flex: none; border-radius: 50%; background: var(--ink-soft); }
    .task-trace[data-status="running"] .trace-dot { background: var(--brand); animation: trace-pulse 1.5s ease-in-out infinite; }
    .task-trace[data-status="completed"] .trace-dot { background: var(--brand); }
    .task-trace[data-status="failed"] .trace-dot { background: var(--danger); }
    .task-trace[data-status="waiting"] .trace-dot, .task-trace[data-status="interrupted"] .trace-dot { background: var(--warn); }
    @keyframes trace-pulse { 50% { opacity: .4; } }
    @media (prefers-reduced-motion: reduce) { .task-trace .trace-dot { animation: none !important; } }
    .trace-title { min-width: 0; overflow-wrap: anywhere; }
    .trace-meta { margin-left: auto; flex: none; color: var(--ink-soft); font-size: 12px; font-variant-numeric: tabular-nums; }
    .trace-current { margin: 0 13px 10px 34px; color: var(--ink-soft); font-size: 12.5px; overflow-wrap: anywhere; }
    .trace-actions { margin: 0 13px 12px 34px; }
    .trace-actions button { min-height: 44px; padding: 8px 14px; border: 1px solid var(--brand); border-radius: var(--radius); background: var(--brand); color: #fff; cursor: pointer; font: inherit; font-size: 13px; }
    .trace-actions button:disabled { opacity: .6; cursor: wait; }
    .trace-actions button:focus-visible { outline: 2px solid var(--brand); outline-offset: 3px; }
    .trace-entry .trace-raw { white-space: pre-wrap; overflow-wrap: anywhere; max-height: 320px; overflow-y: auto; color: var(--ink); }
    .trace-entry .trace-raw-note { color: var(--ink-soft); font-size: 12px; }
    .trace-events { padding: 0 13px 12px 34px; }
    .trace-entry { padding: 8px 0; border-top: 1px solid var(--line); font-size: 12.5px; overflow-wrap: anywhere; }
    .trace-entry[data-status="failed"], .trace-entry.error { color: var(--danger); }
    .trace-entry.message { color: var(--ink); line-height: 1.6; }
    .trace-entry .trace-hint { color: var(--ink-soft); margin: 3px 0 0 22px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .trace-events .msg { margin: 6px 0; }
    .trace-events .bubble { max-width: 100%; }
    .trace-events .event { padding-left: 0; }
    @media (max-width: 480px) { .task-trace summary { flex-wrap: wrap; } .trace-meta { white-space: normal; } }

    /* 居中的时间分隔(聊天应用式) */
    .timesep {
      text-align: center; font-size: 11.5px; color: #9a978f; margin: 12px 0 4px;
    }
    .event.error { color: var(--danger); }
    .event.warning { color: var(--warn); }
    .event details > summary { cursor: pointer; color: var(--ink-soft); }
    .event details > summary:focus-visible { outline: 2px solid var(--brand); }


    .confirm-box {
      background: #fdf6ec; border: 1px solid #f0d9a7; border-radius: var(--radius);
      padding: 13px 14px; margin: 10px 0; font-size: 13.5px;
    }
    .confirm-args {
      max-height: min(40vh, 280px); overflow: auto; margin: 8px 0 0; padding: 8px;
      border: 1px solid var(--line); border-radius: 8px; background: var(--code-bg);
      color: var(--ink); font: 12px/1.45 ui-monospace, "Cascadia Mono", Consolas, monospace;
      white-space: pre-wrap; overflow-wrap: anywhere;
    }
    .confirm-box .acts { margin-top: 10px; display: flex; gap: 8px; }

    button {
      border: none; border-radius: 9px; padding: 8px 15px; font-size: 13px;
      cursor: pointer; font-family: inherit; font-weight: 550; transition: filter .15s;
    }
    button:hover { filter: brightness(.96); }
    .btn-allow { background: var(--brand); color: #fff; }
    .btn-deny { background: var(--control); color: var(--ink); }
    .btn-regenerate { background: var(--control); color: var(--ink); }

    footer { position: relative; padding: 12px 14px 14px; background: var(--bg); border-top: 1px solid var(--line); }
    #scrollToBottom {
      position: absolute; left: 50%; top: -18px; transform: translateX(-50%);
      width: 36px; height: 36px; padding: 0; border: 2px solid var(--brand);
      border-radius: 50%; background: var(--panel); color: var(--brand);
      display: grid; place-items: center; cursor: pointer; z-index: 2;
      box-shadow: 0 1px 4px rgba(28,52,84,.14);
    }
    #scrollToBottom:hover { background: var(--brand-soft); }
    #scrollToBottom:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
    #scrollToBottom[hidden] { display: none; }
    #scrollToBottom svg { width: 18px; height: 18px; }
    .composer-shell {
      position: relative; background: var(--panel); border: 1px solid var(--border-strong); border-radius: 14px;
      padding: 9px 10px 10px; z-index: 1; box-shadow: 0 4px 16px rgba(28,52,84,.07);
      transition: border-color .15s, box-shadow .15s;
    }
    .composer-shell:focus-within { border-color: #8eafea; box-shadow: 0 4px 18px rgba(37,99,235,.12); }
    #text {
      display: block; width: 100%; min-height: 52px; max-height: 140px; border: none; padding: 5px 5px 7px;
      background: transparent; color: var(--ink); font-size: 14px; font-family: inherit; resize: none;
      line-height: 1.5; overflow-y: auto;
    }
    #text:focus { outline: none; }
    #text::placeholder { color: var(--placeholder); }
    .composer-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 34px; }
    .composer-left, .composer-right { display: flex; align-items: center; gap: 6px; min-width: 0; }
    .composer-left { flex: 1 1 auto; }
    .composer-right { flex: none; }
    .round-btn {
      width: 36px; height: 36px; padding: 0; border-radius: 50%; display: inline-flex;
      align-items: center; justify-content: center; flex: none; font-size: 19px; line-height: 1;
    }
    #attach { background: var(--control); color: var(--ink-soft); border: none; }
    #attach svg, #send svg { width: 18px; height: 18px; display: block; }
    #attach:hover { background: var(--control-hover); }
    #send { width: 34px; height: 34px; color: #fff; font-size: 18px; font-weight: 700; }
    #send { background: var(--brand); }
    #send.stop-mode { background: var(--danger); font-size: 13px; }
    #mic {
      background: var(--control); color: var(--ink-soft); border: none; font-size: 20px;
    }
    #mic:hover { background: var(--control-hover); }
    #mic.listening { background: var(--danger); color: #fff; animation: pulse 1.1s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }

    .toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 7px; padding: 0 4px; font-size: 12px; color: var(--ink-soft); }
    .toolbar label { display: flex; align-items: center; gap: 6px; padding: 2px 8px; border-radius: var(--radius); cursor: pointer; }
    #voiceHint { color: var(--brand); }

    .menu-wrap { position: relative; min-width: 0; }
    .capsule {
      height: 30px; max-width: 142px; padding: 0 9px; border-radius: 999px; background: transparent;
      color: var(--ink-soft); border: 1px solid transparent; display: inline-flex; align-items: center;
      gap: 5px; white-space: nowrap; min-width: 0;
    }
    .capsule:hover, .capsule[aria-expanded="true"] { background: var(--brand-soft); border-color: #cddcf7; }
    .capsule .label { overflow: hidden; text-overflow: ellipsis; }
    #modelButton.model-unavailable { color: var(--warn); }
    #modelMenu .menu-option:disabled { color: var(--ink-soft); cursor: not-allowed; }
    .composer-menu {
      position: fixed; left: 0; top: 0; width: min(280px, calc(100vw - 24px));
      max-width: calc(100vw - 24px); max-height: min(300px, calc(100vh - 24px));
      box-sizing: border-box; overflow-x: hidden; overflow-y: auto;
      padding: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
      box-shadow: 0 12px 30px rgba(28,27,25,.16); z-index: 20;
    }
    .composer-menu[hidden] { display: none; }
    .menu-option {
      width: 100%; padding: 9px 10px; border-radius: 8px; background: transparent; color: var(--ink);
      text-align: left; display: grid; grid-template-columns: 20px minmax(0,1fr) 18px; gap: 8px;
      align-items: start; font-weight: 500;
    }
    .menu-option:hover { background: var(--brand-soft); }
    .menu-option .option-icon { color: var(--ink-soft); text-align: center; }
    .menu-option .option-title { display: block; font-size: 13px; overflow-wrap: anywhere; }
    .menu-option .option-desc { display: block; margin-top: 2px; color: var(--ink-soft); font-size: 11.5px; line-height: 1.35; white-space: normal; overflow-wrap: anywhere; }
    .menu-option .check { color: var(--brand); text-align: right; }
    #modelMenu {
      right: auto; bottom: auto; width: max-content; min-width: 0; padding: 4px;
    }
    #modelMenu .menu-option {
      width: 100%; max-width: 100%; padding: 6px 8px;
      grid-template-columns: minmax(0,1fr) 16px; gap: 6px; border-radius: 7px;
    }
    #modelMenu .option-icon { display: none; }
    #modelMenu .option-title, #modelMenu .option-desc {
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; overflow-wrap: normal;
    }
    #modelMenu .option-desc { margin-top: 0; line-height: 1.2; }
    .attachments { display: flex; gap: 8px; overflow-x: auto; padding: 1px 2px 8px; }
    .attachments[hidden] { display: none; }
    .attachment-card {
      position: relative; width: 64px; height: 64px; flex: none; overflow: hidden; border: 1px solid var(--line);
      border-radius: 8px; background: #f4f3f0;
    }
    .attachment-card img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .file-thumb { height: 100%; padding: 10px 5px 5px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 3px; }
    .file-thumb .ext { color: var(--brand); font-size: 11px; font-weight: 700; text-transform: uppercase; }
    .file-thumb .name { width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-soft); font-size: 9px; text-align: center; }
    .remove-attachment {
      position: absolute; top: 3px; right: 3px; width: 19px; height: 19px; padding: 0; border-radius: 50%;
      background: rgba(28,27,25,.82); color: #fff; font-size: 13px; line-height: 1;
    }

    .switch { position: relative; display: inline-block; width: 38px; height: 20px; flex: none; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .switch .track { position: absolute; inset: 0; background: var(--switch-off); border-radius: 999px; transition: .2s; }
    .switch .track::before { content: ""; position: absolute; height: 16px; width: 16px; left: 2px; top: 2px; background: var(--switch-thumb); border-radius: 50%; transition: .2s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
    .switch input:checked + .track { background: var(--brand); }
    .switch input:checked + .track::before { transform: translateX(18px); }
    :root[data-theme="dark"] .confirm-box { background: #322b21; border-color: #655033; }
    :root[data-theme="dark"] .menu-option:hover,
    :root[data-theme="dark"] .capsule:hover,
    :root[data-theme="dark"] .capsule[aria-expanded="true"] { background: var(--control); border-color: var(--line); }
    :root[data-theme="dark"] .message-image,
    :root[data-theme="dark"] .attachment-card { background: var(--control); }
    :root[data-theme="dark"] .timesep { color: #8d8e88; }
    @media (max-width: 560px) {
      header { min-height: 54px; padding: 10px 10px 10px 14px; gap: 5px; }
      header .brand { gap: 9px; }
      header .right { gap: 3px; }
      #continuousButton { width: 32px; padding: 0; justify-content: center; gap: 0; }
      #continuousButton #continuousLabel { display: none; }
      #continuousButton .continuous-switch { width: 26px; }
      #continuousButton[aria-pressed="true"] .continuous-switch::before { transform: translateX(10px); }
      header .ico { width: 28px; height: 28px; }
      header .conn { width: 28px; height: 28px; border-radius: 8px; }
      #log { padding: 16px 12px 20px; }
      .msg { max-width: 92%; }
      footer { padding: 8px 10px 10px; }
      .composer-shell { border-radius: 13px; }
      #text { min-height: 62px; }
      .composer-left { min-width: 0; overflow: visible; }
      .capsule { max-width: 128px; }
    }

    /* 小A工作台视觉基线：聊天页与设置页共用同一套层级和控件语言。 */
    :root {
      --bg: #eef2f7;
      --panel: #ffffff;
      --ink: #172033;
      --ink-soft: #65748a;
      --line: #dce3ec;
      --brand: #2f6fed;
      --brand-soft: #edf4ff;
      --user: #2f6fed;
      --warn: #b7791f;
      --danger: #c84b44;
      --control: #eef2f6;
      --control-hover: #e2e9f1;
      --code-bg: #f2f5f8;
      --placeholder: #8a96a8;
      --border-strong: #d5dee9;
      --scrollbar-thumb: #c4cfdd;
      --radius: 12px;
      --font: "Segoe UI Variable", "Microsoft YaHei UI", "PingFang SC", "Segoe UI", sans-serif;
    }
    :root[data-theme="dark"] {
      --bg: #151b24;
      --panel: #202936;
      --ink: #edf3fb;
      --ink-soft: #aab8c9;
      --line: #344254;
      --brand: #79a7ff;
      --brand-soft: #263b60;
      --user: #316fe8;
      --warn: #f0b85c;
      --danger: #ef766d;
      --control: #2a3544;
      --control-hover: #354355;
      --code-bg: #2a3544;
      --placeholder: #8f9daf;
      --border-strong: #455568;
      --scrollbar-thumb: #536275;
    }
    body { font-family: var(--font); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
    header {
      min-height: 58px;
      padding: 13px 14px 13px 18px;
      background: var(--panel);
      border-bottom-color: var(--line);
      box-shadow: 0 1px 8px rgba(25, 42, 66, .05);
    }
    header .brand { gap: 10px; flex: 0 1 auto; margin-left: -4px; }
    header .dot {
      width: 32px;
      height: 32px;
      background: var(--brand);
      border-radius: 50%;
      font-size: 19px;
      box-shadow: 0 4px 10px rgba(47, 111, 237, .2);
    }
    header .title { font-size: 15px; font-weight: 700; letter-spacing: 0; }
    header .right { gap: 4px; }
    header .ico {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      color: var(--ink-soft);
      transition: background .15s, color .15s;
    }
    header .ico:hover { background: var(--brand-soft); color: var(--brand); }
    :is(#themeToggle, #languageToggle) { width: 32px; height: 32px; background: var(--control); }
    :is(#themeToggle, #languageToggle):hover { background: var(--control-hover); }
    #continuousButton {
      height: 30px;
      background: var(--control);
      border-color: var(--line);
      color: var(--ink-soft);
    }
    #continuousButton:hover, #continuousButton[aria-pressed="true"] {
      background: var(--brand-soft);
      border-color: #cfe0ff;
    }
    #log {
      padding: 24px clamp(16px, 4vw, 42px);
      background: var(--bg);
    }
    .msg { max-width: min(86%, 860px); margin-bottom: 30px; }
    .bubble {
      padding: 11px 15px;
      border-radius: 14px;
      line-height: 1.65;
      box-shadow: 0 2px 8px rgba(25, 42, 66, .035);
    }
    .user .bubble { background: var(--user); border-bottom-right-radius: 5px; box-shadow: 0 4px 12px rgba(47, 111, 237, .14); }
    .assistant .bubble { border-color: var(--line); border-bottom-left-radius: 5px; }
    .message-image { border-radius: 10px; }
    .bubble code, .bubble pre.code { border-radius: 9px; }
    .md-table-wrap { border-radius: 10px; }
    .confirm-box {
      border-radius: 12px;
      border-color: #f1d9a7;
      box-shadow: 0 2px 8px rgba(25, 42, 66, .035);
    }
    button {
      border-radius: 10px;
      font-weight: 650;
      transition: background .15s, color .15s, border-color .15s, box-shadow .15s, transform .1s;
    }
    button:hover { filter: none; transform: translateY(-1px); }
    button:active { transform: translateY(0); }
    button:focus-visible, textarea:focus-visible, input:focus-visible {
      outline: 2px solid var(--brand);
      outline-offset: 2px;
    }
    .btn-allow { box-shadow: 0 4px 10px rgba(47, 111, 237, .16); }
    footer { padding: 11px 14px 14px; border-top-color: var(--line); }
    .composer-shell {
      border-radius: 14px;
      border-color: var(--border-strong);
      box-shadow: 0 6px 20px rgba(25, 42, 66, .08);
    }
    .composer-shell:focus-within {
      border-color: #9dbcf3;
      box-shadow: 0 6px 22px rgba(47, 111, 237, .13);
    }
    #text { font-size: 14px; line-height: 1.6; }
    .round-btn { width: 38px; height: 38px; }
    #attach, #mic { background: var(--control); }
    #attach:hover, #mic:hover { background: var(--control-hover); color: var(--ink); }
    #send { box-shadow: 0 4px 10px rgba(47, 111, 237, .22); }
    .capsule {
      height: 32px;
      border-color: var(--line);
      background: var(--control);
      color: var(--ink-soft);
    }
    .capsule:hover, .capsule[aria-expanded="true"] {
      background: var(--brand-soft);
      border-color: #cfe0ff;
      color: var(--brand);
    }
    .composer-menu {
      border-color: var(--line);
      border-radius: 12px;
      box-shadow: 0 14px 32px rgba(25, 42, 66, .16);
    }
    .menu-option { border-radius: 9px; }
    .menu-option:hover { background: var(--brand-soft); }
    .attachment-card { border-radius: 10px; }
    @media (max-width: 620px) {
      header { padding-left: 12px; padding-right: 10px; }
      header .brand { margin-left: 2px; }
      header .title { max-width: 110px; }
      #log { padding: 18px 12px; }
      .msg { max-width: 92%; }
      footer { padding: 8px 9px 10px; }
      .composer-left { overflow-x: auto; }
      .capsule { max-width: 150px; }
    }
    #chatViewport { position: relative; flex: 1; min-height: 0; display: flex; }
    #log { min-width: 0; padding-right: 56px; }
    #messageNavigator {
      position: absolute; z-index: 3; right: 12px; top: 50%; transform: translateY(-50%);
      display: flex; width: 36px; max-width: calc(100% - 24px); max-height: min(360px, 80%);
      border: 1px solid transparent; border-radius: var(--radius);
      transition: width .18s ease, box-shadow .18s ease;
    }
    #messageNavigator[hidden] { display: none; }
    /* 消息预览始终使用主题的实色衬底，展开时立即遮住下方聊天文字。 */
    #messageNavigator:hover, #messageNavigator:focus-within {
      width: 340px; background: var(--panel); border-color: var(--line);
      box-shadow: 0 14px 32px rgba(25, 42, 66, .16);
    }
    .message-nav-list { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden;
      overscroll-behavior: contain; scrollbar-width: none; padding: 8px 0; }
    .message-nav-list::-webkit-scrollbar { display: none; }
    .message-nav-item {
      display: flex; align-items: center; justify-content: flex-end; gap: 0;
      width: 100%; height: 28px; min-height: 28px; padding: 0 8px; margin: 0;
      border: 0; border-radius: 6px; background: transparent; color: var(--ink-soft);
      font: inherit; font-size: 13px; text-align: right; cursor: pointer;
    }
    #messageNavigator:hover .message-nav-item, #messageNavigator:focus-within .message-nav-item { gap: 12px; }
    .message-nav-item::after { content: ""; flex: none; width: 10px; height: 2px;
      border-radius: 2px; background: var(--scrollbar-thumb); transition: width .18s ease, background .18s ease; }
    .message-nav-item[aria-current="true"] { color: var(--ink); }
    .message-nav-item[aria-current="true"]::after { width: 18px; background: var(--ink); }
    .message-nav-item:hover { background: var(--brand-soft); color: var(--ink); }
    .message-nav-item:focus-visible { outline: 2px solid var(--brand); outline-offset: -2px; }
    .message-nav-label { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
      opacity: 0; transition: opacity .15s ease; }
    #messageNavigator:hover .message-nav-label, #messageNavigator:focus-within .message-nav-label { opacity: 1; }
    @media (max-width: 620px) { #chatViewport #log { padding-right: 52px; } #messageNavigator { right: 8px; } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; scroll-behavior: auto !important; }
    }
    /* 复用主题色；标准/半透明模式保留现有内容底色。 */
    :root[data-background="translucent"] {
      --window-bg: color-mix(in srgb, var(--bg) 90%, transparent);
      --window-panel: color-mix(in srgb, var(--panel) 94%, transparent);
    }
    :root[data-background="transparent"] {
      --window-bg: transparent;
      --window-panel: transparent;
    }
    :root[data-background="transparent"] body, :root[data-background="translucent"] body { background: transparent; }
    :root[data-background="transparent"] #log, :root[data-background="translucent"] #log,
    :root[data-background="transparent"] footer, :root[data-background="translucent"] footer { background: var(--window-bg); }
    :root[data-background="transparent"] header, :root[data-background="translucent"] header { background: var(--window-panel); }
    :root[data-background="transparent"] header .ico, :root[data-background="translucent"] header .ico { background: var(--control); }
    /* 语音控件保留衬底；工具步骤在所有背景模式下均不加背景框。 */
    :root:is([data-background="translucent"], [data-background="transparent"]) :is(.toolbar label, #voiceHint) {
      background: var(--bg); border-radius: var(--radius);
    }
    :root[data-background="transparent"] header .status { background: var(--panel); border-radius: var(--radius); }
    /* 全透明模式：仅背景色使用 70% 不透明度，文字/图标/内容不使用 opacity。 */
    :root[data-background="transparent"] { --surface-opacity: 70%; }
    :root[data-background="transparent"] :is(.assistant .bubble, .composer-shell, .composer-menu, .md-table, #scrollToBottom, header .status) {
      background: color-mix(in srgb, var(--panel) var(--surface-opacity), transparent);
    }
    :root[data-background="transparent"] .user .bubble {
      background: color-mix(in srgb, var(--user) var(--surface-opacity), transparent);
    }
    :root[data-background="transparent"] :is(header .ico, #themeToggle, #continuousButton, #conversationButton, .bubble-copy, .btn-deny, .btn-regenerate, #attach, #mic, .capsule) {
      background: color-mix(in srgb, var(--control) var(--surface-opacity), transparent);
    }
    :root[data-background="transparent"] :is(.toolbar label, #voiceHint) {
      background: color-mix(in srgb, var(--bg) var(--surface-opacity), transparent);
    }
    :root[data-background="transparent"] :is(.bubble code, .bubble pre.code, .trace-entry code, .trace-entry pre.code, .md-table th, .confirm-args) {
      background: color-mix(in srgb, var(--code-bg) var(--surface-opacity), transparent);
    }
    :root[data-background="transparent"] :is(header .dot, #send, .btn-allow, .trace-actions button, #continuousButton[aria-pressed="true"] .continuous-switch, .switch input:checked + .track) {
      background: color-mix(in srgb, var(--brand) var(--surface-opacity), transparent);
    }
    :root[data-background="transparent"] :is(.continuous-switch, .switch .track) {
      background: color-mix(in srgb, var(--switch-off) var(--surface-opacity), transparent);
    }
    :root[data-background="transparent"] :is(header .ico:hover, #continuousButton:hover, #continuousButton[aria-pressed="true"], .capsule:hover, .capsule[aria-expanded="true"], .menu-option:hover, #scrollToBottom:hover) {
      background: color-mix(in srgb, var(--brand-soft) var(--surface-opacity), transparent);
    }
    :root[data-background="transparent"] :is(#themeToggle:hover, #languageToggle:hover, #conversationButton:hover, .bubble-copy:hover, #attach:hover, #mic:hover) {
      background: color-mix(in srgb, var(--control-hover) var(--surface-opacity), transparent);
    }
    :root[data-background="transparent"] :is(#send.stop-mode, #mic.listening) {
      background: color-mix(in srgb, var(--danger) var(--surface-opacity), transparent);
    }
    :root[data-background="transparent"] .confirm-box { background: color-mix(in srgb, #fdf6ec var(--surface-opacity), transparent); }
    :root[data-background="transparent"] .message-image { background: color-mix(in srgb, #f1f0ed var(--surface-opacity), transparent); }
    :root[data-background="transparent"] .attachment-card { background: color-mix(in srgb, #f4f3f0 var(--surface-opacity), transparent); }
    :root[data-background="transparent"] .remove-attachment { background: rgb(28 27 25 / var(--surface-opacity)); }
    :root[data-background="transparent"][data-theme="dark"] .confirm-box { background: color-mix(in srgb, #322b21 var(--surface-opacity), transparent); }
    :root[data-background="transparent"][data-theme="dark"] :is(.message-image, .attachment-card) {
      background: color-mix(in srgb, var(--control) var(--surface-opacity), transparent);
    }
    :root[data-background="transparent"] :is(#log, .md-table-wrap)::-webkit-scrollbar-corner { background: transparent; }
    :root[data-background="transparent"] :is(#log, .md-table-wrap)::-webkit-scrollbar-thumb {
      background: color-mix(in srgb, var(--scrollbar-thumb) var(--surface-opacity), transparent);

    #connectionNotice { margin: 0; padding: 12px 16px 12px 68px; flex: none; background: var(--panel); border-bottom: 1px solid var(--line); font-size: 14px; overflow-wrap: anywhere; }
    #connectionNotice[hidden] { display: none; }
    #connectionNotice button { min-height: 44px; margin-top: 8px; background: var(--control); color: var(--ink); }
    #connectionNotice a { color: var(--brand); }
    /* 浏览器使用可见视口；聊天记录独立滚动，输入区始终留在屏幕内。 */
    :root:not([data-desktop="true"]) { overflow: hidden; }
    :root:not([data-desktop="true"]) body {
      position: fixed; top: var(--app-top, 0px); left: 0; width: 100%;
      height: 100vh; height: var(--app-height, 100dvh); overflow: hidden;
    }
    header, footer { flex-shrink: 0; }
    #log { min-height: 0; overscroll-behavior-y: contain; }
    :root:not([data-desktop="true"]) #settingsModal { position: absolute; }
    @media (max-width: 620px), (pointer: coarse) {
      :root:not([data-desktop="true"]) body { font-size: 16px; }
      :root:not([data-desktop="true"]) header {
        min-height: 60px; padding: calc(8px + env(safe-area-inset-top)) 8px 8px 12px;
      }
      :root:not([data-desktop="true"]) header .brand { gap: 4px; margin-left: 0; }
      :root:not([data-desktop="true"]) header .dot { width: 44px; height: 44px; }
      :root:not([data-desktop="true"]) header .dot span { font-size: 32px; transform: translateY(-2px); }
      :root:not([data-desktop="true"]) header .ico { display: grid; place-items: center; font-size: 22px; line-height: 1; }
      :root:not([data-desktop="true"]) #continuousButton { width: 44px; padding: 0; justify-content: center; gap: 0; }
      :root:not([data-desktop="true"]) #continuousLabel { display: none; }

      :root:not([data-desktop="true"]) :is(header .ico, #continuousButton, #conversationButton, .round-btn, #send, .capsule) {
        min-width: 44px; min-height: 44px; touch-action: manipulation;
      }
      :root:not([data-desktop="true"]) :is(#windowToggle, #collapse) { display: none; }
      :root:not([data-desktop="true"]) #conversationButton {
        top: calc(76px + env(safe-area-inset-top)); left: max(12px, env(safe-area-inset-left));
      }
      :root:not([data-desktop="true"]) #log { padding: 68px 12px 16px; }
      :root:not([data-desktop="true"]) .bubble { font-size: 16px; }
      :root:not([data-desktop="true"]) footer {
        padding: 8px max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
      }
      :root:not([data-desktop="true"]) :is(#text, .capsule) { font-size: 16px; }
      :root:not([data-desktop="true"]) .composer-left { overflow: visible; }
      :root:not([data-desktop="true"]) .menu-wrap { flex: 1; }
      :root:not([data-desktop="true"]) .capsule { max-width: 100%; }
      :root:not([data-desktop="true"]) #text { min-height: 52px; max-height: min(140px, 25dvh); }
      :root:not([data-desktop="true"]) .toolbar { margin-bottom: 4px; }
      :root:not([data-desktop="true"]) .toolbar label { min-height: 36px; font-size: 13px; }
      :root:not([data-desktop="true"]) #modelMenu .menu-option { min-height: 44px; }
      :root:not([data-desktop="true"]) #modelMenu .option-title { font-size: 15px; }
      :root:not([data-desktop="true"]) #conversationPanel {
        top: calc(72px + env(safe-area-inset-top)); max-height: calc(var(--app-height, 100dvh) - 88px - env(safe-area-inset-top));
      }
      :root:not([data-desktop="true"]) :is(.conversation-panel-actions button, .conversation-item-action) { min-width: 44px; min-height: 44px; }
      :root:not([data-desktop="true"]) .conversation-item { height: auto; min-height: 52px; }
      :root:not([data-desktop="true"]) .conversation-panel-head { height: 52px; padding-left: 14px; flex-shrink: 0; }
      :root:not([data-desktop="true"]) #settingsModal { padding: 0; }
      :root:not([data-desktop="true"]) .settings-modal-panel { width: 100%; height: 100%; min-height: 0; border-radius: 0; }
      :root:not([data-desktop="true"]) .settings-modal-head { height: calc(52px + env(safe-area-inset-top)); padding-top: env(safe-area-inset-top); }
      :root:not([data-desktop="true"]) #closeSettingsModal { width: 44px; height: 44px; }
    }
    /* Compact windows keep both control groups on one line with fixed-size buttons. */
    @media (max-width: 560px) {
      header { flex-wrap: nowrap; gap: 4px; padding-left: 10px; padding-right: 10px; }
      header .brand { flex: 0 0 auto; min-width: max-content; margin-left: 0; gap: clamp(4px, 1.5vw, 8px); }
      header .brand > * { flex: none; }
      header .right { flex: 0 0 auto; gap: clamp(3px, .8vw, 4px); }
      .toolbar { flex-wrap: nowrap; white-space: nowrap; }
      .toolbar label { flex: none; white-space: nowrap; }
      .composer-bar, .composer-left { min-width: 0; }
      .composer-left { overflow-x: auto; }
      .composer-right { flex: none; }
    }
    .window-resize { display: none; position: fixed; z-index: 100; -webkit-app-region: no-drag; touch-action: none; }
    :root[data-desktop="true"] .window-resize { display: block; }
    :root[data-maximized="true"] .window-resize { display: none; }
    .window-resize[data-edge="n"] { top: 0; left: 10px; right: 10px; height: 5px; cursor: ns-resize; }
    .window-resize[data-edge="s"] { bottom: 0; left: 10px; right: 10px; height: 5px; cursor: ns-resize; }
    .window-resize[data-edge="e"] { right: 0; top: 10px; bottom: 10px; width: 5px; cursor: ew-resize; }
    .window-resize[data-edge="w"] { left: 0; top: 10px; bottom: 10px; width: 5px; cursor: ew-resize; }
    .window-resize[data-edge="ne"] { top: 0; right: 0; width: 10px; height: 10px; cursor: nesw-resize; }
    .window-resize[data-edge="nw"] { top: 0; left: 0; width: 10px; height: 10px; cursor: nwse-resize; }
    .window-resize[data-edge="se"] { bottom: 0; right: 0; width: 10px; height: 10px; cursor: nwse-resize; }
    .window-resize[data-edge="sw"] { bottom: 0; left: 0; width: 10px; height: 10px; cursor: nesw-resize; }
  </style>
</head>
<body>
  <div class="window-resize" data-edge="n" aria-hidden="true"></div>
  <div class="window-resize" data-edge="s" aria-hidden="true"></div>
  <div class="window-resize" data-edge="e" aria-hidden="true"></div>
  <div class="window-resize" data-edge="w" aria-hidden="true"></div>
  <div class="window-resize" data-edge="ne" aria-hidden="true"></div>
  <div class="window-resize" data-edge="nw" aria-hidden="true"></div>
  <div class="window-resize" data-edge="se" aria-hidden="true"></div>

  <header>
    <span class="brand">
      <span class="dot"><span>a</span></span>
      <button class="ico" id="languageToggle" type="button" title="切换为英文" aria-label="切换为英文" aria-pressed="false" data-no-i18n>中</button>
      <button class="ico" id="themeToggle" type="button" title="切换为深色模式" aria-label="切换为深色模式" aria-pressed="false">☀</button>
      <button id="continuousButton" type="button" aria-label="连续语音对话" aria-pressed="false" data-state="off"
        title="开启连续语音对话">
        <span id="continuousLabel">连续对话</span>
        <span class="continuous-switch" aria-hidden="true"></span>
      </button>
    </span>
    <span class="status" id="status" role="status" aria-live="polite"></span>
    <span class="right">
      <span class="conn" id="conn" title="连接状态"></span>
      <button class="ico" id="navSettings" type="button" title="设置" aria-label="设置">⚙</button>
      <button class="ico" id="windowToggle" type="button" title="最大化" aria-label="最大化" data-maximized="false"><span class="window-icon" aria-hidden="true"></span></button>
      <button class="ico" id="collapse" title="收起到悬浮球">—</button>
    </span>
  </header>
  <button id="conversationButton" type="button" title="多任务 / 多对话" aria-label="多任务 / 多对话" aria-expanded="false">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <circle cx="5" cy="6" r="1"></circle><path d="M9 6h10"></path>
      <circle cx="5" cy="12" r="1"></circle><path d="M9 12h10"></path>
      <circle cx="5" cy="18" r="1"></circle><path d="M9 18h7"></path>
    </svg>
    <span class="conversation-badge" aria-hidden="true"></span>
  </button>
  <div id="connectionNotice" role="status" aria-live="polite" hidden>
    <div id="connectionNoticeText"></div>
    <button id="retryConnection" type="button">重新连接</button>
    <a id="connectionLogin" href="/login" hidden>重新登录</a>
  </div>
  <div id="chatViewport">
    <div id="log"></div>
    <nav id="messageNavigator" aria-label="消息定位" hidden>
      <div class="message-nav-list"></div>
    </nav>
  </div>
  <aside id="conversationPanel" hidden aria-label="多任务与对话">
    <div class="conversation-panel-head">
      <span class="conversation-panel-title">多任务与对话</span>
      <span class="conversation-panel-actions">
        <button id="newConversationButton" type="button" title="新建对话" aria-label="新建对话">＋</button>
        <button id="closeConversationButton" type="button" title="关闭" aria-label="关闭">×</button>
      </span>
    </div>
    <div id="conversationList"></div>
  </aside>
  <dialog id="conversationConfirm" aria-labelledby="conversationConfirmTitle" aria-describedby="conversationConfirmMessage">
    <div class="conversation-confirm-content">
      <strong id="conversationConfirmTitle">确认删除对话</strong>
      <p id="conversationConfirmMessage"></p>
      <div class="conversation-confirm-actions">
        <button type="button" data-confirm-cancel>取消</button>
        <button type="button" class="danger" data-confirm-accept>删除</button>
      </div>
    </div>
  </dialog>
  <div id="settingsModal" hidden role="dialog" aria-modal="true" aria-labelledby="settingsModalTitle">
    <div class="settings-modal-panel" role="document">
      <div class="settings-modal-head">
        <strong class="settings-modal-title" id="settingsModalTitle">设置</strong>
        <button id="closeSettingsModal" type="button" title="关闭设置" aria-label="关闭设置">×</button>
      </div>
      <iframe id="settingsFrame" title="小A设置" loading="lazy"></iframe>
    </div>
  </div>
  <footer>
    <button id="scrollToBottom" type="button" title="滚动到最新消息" aria-label="滚动到最新消息" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 4v15m-6-6 6 6 6-6" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" /></svg>
    </button>
    <div class="toolbar">
      <label title='开启后喊"小A"即可唤醒,且回复会朗读'>
        语音唤醒
        <span class="switch"><input type="checkbox" id="wakeToggle"><span class="track"></span></span>
      </label>
      <span id="voiceHint"></span>
    </div>
    <div class="composer-shell">
      <div class="attachments" id="attachmentList" hidden></div>
      <textarea id="text" rows="2" aria-label="消息" placeholder="给小A发送消息"></textarea>
      <div class="composer-bar">
        <div class="composer-left">
          <button class="round-btn" id="attach" type="button" title="添加文件或图片" aria-label="添加文件或图片">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m16.5 6.5-7.8 7.8a3.25 3.25 0 0 0 4.6 4.6l7.1-7.1a4.75 4.75 0 0 0-6.7-6.7l-7.8 7.8a6.25 6.25 0 0 0 8.8 8.8l7-7" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" /></svg>
          </button>
          <div class="menu-wrap">
            <button class="capsule" id="modelButton" type="button" aria-expanded="false" aria-haspopup="menu" title="切换模型">
              <span class="label" id="modelLabel">模型</span>
            </button>
            <div class="composer-menu" id="modelMenu" role="menu" hidden></div>
          </div>
        </div>
        <div class="composer-right">
          <button class="round-btn" id="mic" type="button" title="按住或点击说话" aria-label="语音输入">🎤</button>
          <button class="round-btn" id="send" type="button" title="发送" aria-label="发送">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 19V5m-6 6 6-6 6 6" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" /></svg>
          </button>
        </div>
      </div>
    </div>
    <input id="attachmentInput" type="file" multiple hidden />
  </footer>

  <script src="./ui-language.js"></script>
  <script src="./markdown-table.js"></script>
  <script src="./vendor/katex/katex.min.js"></script>
  <script src="./math-renderer.js"></script>
  <script src="./chat-navigator.js"></script>
  <script>
    // Electron 里是 file:// 协议,固定连本机;浏览器版用当前 host
    const IS_LOCAL_FILE = location.protocol === "file:" || !location.host;
    const HOST = IS_LOCAL_FILE ? "127.0.0.1:1985" : location.host;
    const WS_URL = (IS_LOCAL_FILE ? "ws:" : location.protocol === "https:" ? "wss:" : "ws:") + "//" + HOST + "/ws";
    const API = (IS_LOCAL_FILE ? "http:" : location.protocol) + "//" + HOST;
    let voiceCloud = false; // 后端是否配了云语音
    const log = document.getElementById("log");
    const scrollToBottomBtn = document.getElementById("scrollToBottom");
    const messageNavigator = window.createChatNavigator(log, document.getElementById("messageNavigator"));
    const statusEl = document.getElementById("status");
    const textEl = document.getElementById("text");
    const sendBtn = document.getElementById("send");
    const attachBtn = document.getElementById("attach");
    const attachmentInput = document.getElementById("attachmentInput");
    const attachmentList = document.getElementById("attachmentList");
    const modelButton = document.getElementById("modelButton");
    const modelMenu = document.getElementById("modelMenu");
    const modelLabel = document.getElementById("modelLabel");
    const continuousButton = document.getElementById("continuousButton");
    const continuousLabel = document.getElementById("continuousLabel");
    const themeToggle = document.getElementById("themeToggle");
    const conversationButton = document.getElementById("conversationButton");
    const conversationPanel = document.getElementById("conversationPanel");
    const conversationList = document.getElementById("conversationList");
    const newConversationButton = document.getElementById("newConversationButton");
    const closeConversationButton = document.getElementById("closeConversationButton");
    let currentConversationId = "default";
    let draftConversationId = "";
    const conversationStore = new Map();
    const THEME_KEY = "xiaoa.theme";
    function applyChatBackground(state) {
      const mode = ["standard", "translucent", "transparent"].includes(state?.mode) ? state.mode : "standard";
      document.documentElement.dataset.background = mode;
    }
    if (window.bridge?.getChatBackground) {
      // 先订阅后读初始值，忽略过期读结果，避免快速切换时覆盖新模式。
      let backgroundChanged = false;
      window.bridge.onChatBackground((state) => { backgroundChanged = true; applyChatBackground(state); });
      window.bridge.getChatBackground().then((state) => {
        if (!backgroundChanged) applyChatBackground(state);
      }).catch(() => { if (!backgroundChanged) applyChatBackground(null); });
    }
    if (window.bridge?.resizeChat) {
      document.documentElement.dataset.desktop = "true";
      for (const handle of document.querySelectorAll(".window-resize")) {
        let pointer = null;
        const endResize = (event) => {
          if (pointer === null || (event?.pointerId !== undefined && event.pointerId !== pointer)) return;
          pointer = null;
          window.bridge.resizeChat("end");
        };
        handle.addEventListener("pointerdown", (event) => {
          if (event.button !== 0) return;
          event.preventDefault();
          pointer = event.pointerId;
          handle.setPointerCapture(pointer);
          window.bridge.resizeChat("start", handle.dataset.edge);
        });
        window.addEventListener("pointermove", (event) => {
          if (event.pointerId === pointer) window.bridge.resizeChat("move");
        });
        // 改变窗口尺寸后边缘元素会移动，松手事件必须在窗口级接收。
        for (const type of ["pointerup", "pointercancel"]) window.addEventListener(type, endResize);
        handle.addEventListener("lostpointercapture", endResize);
        window.addEventListener("blur", endResize);
      }
    }
    function syncSettingsTheme(theme = document.documentElement.dataset.theme) {
      const normalized = theme === "dark" ? "dark" : "light";
      document.getElementById("settingsModal")?.setAttribute("data-theme", normalized);
      document.getElementById("settingsFrame")?.contentWindow?.postMessage(
        { type: "xiaoa-theme", theme: normalized },
        "*",
      );
    }

    function applyTheme(theme) {
      const dark = theme === "dark";
      document.documentElement.dataset.theme = dark ? "dark" : "light";
      window.bridge?.setChatTheme?.(dark ? "dark" : "light").catch(() => {});
      themeToggle.textContent = dark ? "☾" : "☀";
      themeToggle.setAttribute("aria-pressed", String(dark));
      const label = dark ? "切换为浅色模式" : "切换为深色模式";
      themeToggle.title = label;
      themeToggle.setAttribute("aria-label", label);
      syncSettingsTheme(dark ? "dark" : "light");
    }
    applyTheme(localStorage.getItem(THEME_KEY) === "dark" ? "dark" : "light");
    themeToggle.onclick = () => {
      const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
      localStorage.setItem(THEME_KEY, next);
      applyTheme(next);
    };
    const windowToggle = document.getElementById("windowToggle");
    function applyMaximized(maximized) {
      const active = Boolean(maximized);
      windowToggle.dataset.maximized = String(active);
      document.documentElement.dataset.maximized = String(active);
      const label = active ? "还原窗口" : "最大化";
      windowToggle.title = label;
      windowToggle.setAttribute("aria-label", label);
    }
    windowToggle.onclick = async () => {
      if (window.bridge && typeof window.bridge.toggleMaximize === "function") {
        applyMaximized(await window.bridge.toggleMaximize());
        return;
      }
      if (document.fullscreenElement) await document.exitFullscreen();
      else await document.documentElement.requestFullscreen();
      applyMaximized(Boolean(document.fullscreenElement));
    };
    document.addEventListener("fullscreenchange", () => applyMaximized(Boolean(document.fullscreenElement)));
    if (window.bridge && typeof window.bridge.getMaximized === "function") {
      window.bridge.getMaximized().then(applyMaximized).catch(() => {});
      if (typeof window.bridge.onMaximizedChange === "function") window.bridge.onMaximizedChange(applyMaximized);
    }
    let availableModels = [];
    let selectedModel = "";
    let selectedProviderId = "default";
    const MODEL_SELECTION_KEY = "xiaoa.modelSelection";
    const conversationModelSelections = new Map();
    let modelsLoaded = false;

    function rememberConversationModel(sync = false) {
      if (!selectedModel || (!conversationStore.has(currentConversationId) && !draftConversationId)) return;
      const selection = {provider_id: selectedProviderId, model: selectedModel};
      conversationModelSelections.set(currentConversationId, selection);
      try {
        localStorage.setItem(`${MODEL_SELECTION_KEY}.${currentConversationId}`, JSON.stringify(selection));
      } catch (_) {}
      if (sync && conversationStore.has(currentConversationId) && ws && ws.readyState === WebSocket.OPEN) {
        sendConversationCommand("conversation_model", {conversation_id: currentConversationId, ...selection});
      }
    }

    function restoreConversationModel() {
      let selection = conversationModelSelections.get(currentConversationId)
        || conversationStore.get(currentConversationId)?.model_selection;
      if (!selection) {
        try { selection = JSON.parse(localStorage.getItem(`${MODEL_SELECTION_KEY}.${currentConversationId}`) || "null"); } catch (_) {}
      }
      if (selection && typeof selection.model === "string" && selection.model) {
        selectedModel = selection.model;
        selectedProviderId = selection.provider_id || "default";
      } else if (modelsLoaded) {
        // New/unbound conversations use the last valid choice, never inherit a removed model.
        const option = availableModels.find(item => item.provider_id === selectedProviderId && item.model === selectedModel)
          || availableModels[0];
        selectedModel = option?.model || "";
        selectedProviderId = option?.provider_id || "default";
      }
      if (modelsLoaded || selection) rememberConversationModel();
      renderModelMenu();
    }

    function selectedModelUnavailable() {
      return modelsLoaded && !availableModels.some(item =>
        item.provider_id === selectedProviderId && item.model === selectedModel);
    }
    const REASONING_EFFORT_KEY = "xiaoa.reasoningEffort";
    const REASONING_EFFORTS = ["low", "medium", "high", "xhigh"];
    function getReasoningEffort() {
      try {
        const value = localStorage.getItem(REASONING_EFFORT_KEY);
        if (REASONING_EFFORTS.includes(value)) return value;
      } catch (_) {}
      return "high";
    }
    let pendingAttachments = [];
    let taskBusy = false;
    let ws, connecting = false, reconnectTimer = null;
    // 首次握手快速重试；稳定连接后的断线仍使用常规退避。
    let connectedOnce = false, reconnectDelay = 300;
    const RECONNECT_MIN = 1000, RECONNECT_MAX = 15000;
    function scheduleReconnect() {
      const delay = reconnectDelay;
      reconnectDelay = connectedOnce ? Math.min(delay * 2, RECONNECT_MAX)
        : (delay < 500 ? 500 : 1000);
      reconnectTimer = setTimeout(connect, delay);
    }
    if (window.bridge && bridge.onBackendReady) bridge.onBackendReady(() => void connect());
    let heartbeatTimer = null;   // 轻量心跳:定时发个 ping 让死连接尽快暴露(后端忽略未知类型)
    const MAX_DELIVERY_ATTEMPTS = 5;
    const DELIVERY_RETRY_DELAYS = [1200, 2200, 4000, 7000, 10000];
    const pendingDeliveries = new Map();

    let healthLoading = false;
    let healthRefreshQueued = false;
    let healthRetryTimer = null;
    async function refreshHealth() {
      if (healthLoading) {
        healthRefreshQueued = true;
        return;
      }
      healthLoading = true;
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 5000);
      try {
        const response = await fetch(API + "/health", {signal: controller.signal});
        if (!response.ok) throw new Error("health request failed");
        const d = await response.json();
        if (healthRetryTimer) {
          clearTimeout(healthRetryTimer);
          healthRetryTimer = null;
        }
        voiceCloud = !!d.voice;
        // health 探活成功且 WS 还连着时,把之前的"服务异常"红点自动恢复。
        // 只清 service_failed(真故障探活通过即恢复),不碰 setConn(false) 的
        // "未连接"状态(那要等 WS 自己重连)。
        if (serviceFailed && ws && ws.readyState === WebSocket.OPEN) {
          setServiceHealthy();
        }
        if (window.bridge && window.bridge.setOpenAtLogin && typeof d.open_at_login === "boolean") {
          window.bridge.setOpenAtLogin(d.open_at_login).catch(() => {});
        }
        availableModels = Array.isArray(d.model_options)
          ? d.model_options
          : Array.from(new Set([d.chat_model, ...(d.models || [])].filter(Boolean))).map(model => ({
              provider_id: "default", provider_name: "默认接口", model,
            }));
        if (!selectedModel) {
          let saved = null;
          try { saved = JSON.parse(localStorage.getItem(MODEL_SELECTION_KEY) || "null"); } catch (_) {}
          const initialOption = availableModels.find(item => item.provider_id === saved?.provider_id && item.model === saved?.model)
            || availableModels.find(item => item.provider_id === "default" && item.model === d.chat_model)
            || availableModels[0];
          selectedModel = initialOption?.model || "";
          selectedProviderId = initialOption?.provider_id || "default";
        }
        modelsLoaded = true;
        restoreConversationModel();
      } catch (_) {
        if (!healthRetryTimer) healthRetryTimer = setTimeout(() => {
          healthRetryTimer = null;
          refreshHealth();
        }, 1500);
      } finally {
        clearTimeout(timeout);
        healthLoading = false;
        if (healthRefreshQueued) {
          healthRefreshQueued = false;
          refreshHealth();
        }
      }
    }

    function toggleComposerMenu(menu, button) {
      const opening = menu.hidden;
      closeComposerMenus();
      menu.hidden = !opening;
      button.setAttribute("aria-expanded", String(opening));
      menu.style.transform = "";
      if (opening) {
        const buttonRect = button.getBoundingClientRect();
        const rect = menu.getBoundingClientRect();
        const edge = 12;
        const left = Math.max(edge, Math.min(buttonRect.left, innerWidth - edge - rect.width));
        let top = buttonRect.top - rect.height - 8;
        if (top < edge) top = buttonRect.bottom + 8;
        top = Math.max(edge, Math.min(top, innerHeight - edge - rect.height));
        menu.style.left = `${left}px`;
        menu.style.top = `${top}px`;
      }
    }

    async function addAttachmentFiles(files) {
      for (const file of files) {
        if (pendingAttachments.length >= MAX_ATTACHMENTS) {
          addEvent("error", `一次最多添加 ${MAX_ATTACHMENTS} 个附件。`);
          break;
        }
        if (file.size > MAX_ATTACHMENT_BYTES) {
          addEvent("error", `${file.name} 超过 6 MB，未添加。`);
          continue;
        }
        const currentTotal = pendingAttachments.reduce((sum, item) => sum + item.size, 0);
        if (currentTotal + file.size > MAX_ATTACHMENTS_TOTAL) {
          addEvent("error", "附件总大小不能超过 12 MB。");
          break;
        }
        try {
          pendingAttachments.push({
            id: `${Date.now()}-${Math.random()}`,
            name: file.name,
            type: file.type || "application/octet-stream",
            size: file.size,
            data: await fileDataUrl(file),
          });
        } catch (error) {
          addEvent("error", `${file.name} 读取失败：${error.message || error}`);
        }
      }
      renderAttachments();
    }

    async function diagnoseConnection() {
      if (IS_LOCAL_FILE || connectionCheckRunning) return;
      connectionCheckRunning = true;
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 5000);
      let message = "网络连接中断，正在重连。请检查网络后重试。", login = false;
      try {
        // 使用受登录保护的轻量接口，区分会话过期与聊天通道被拦截。
        const response = await fetch(API + "/api/current_voice", {signal: controller.signal, cache: "no-store"});
        if (response.status === 401) {
          message = "此浏览器尚未登录或登录已失效。每个浏览器需要分别登录。";
          login = true;
        } else if (response.status === 403) {
          message = "服务器未开放远程访问，请检查网页访问密码配置。";
        } else if (response.ok) {
          message = "网页可访问，但聊天通道未连接。请确认此浏览器信任 HTTPS 证书；部分浏览器的安全检查或代理可能拦截聊天连接。可尝试使用已配置可信证书的网址。";
        }
      } catch (_) {
        message = "无法连接服务器。请检查网络及此浏览器的 HTTPS 证书提示后重试。";
      } finally {
        clearTimeout(timeout);
        connectionCheckRunning = false;
      }
      if (!ws || ws.readyState !== WebSocket.OPEN) showConnectionNotice(message, login);
    }
