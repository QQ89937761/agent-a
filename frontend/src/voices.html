<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' http://127.0.0.1:1985 https:; media-src 'self' data:; object-src 'none'; base-uri 'none'" />
  <title>小A · 选音色</title>
  <style>
    :root { color-scheme: light; --font-ui: "Segoe UI Variable", "Microsoft YaHei UI", "PingFang SC", "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; font-family: var(--font-ui);
      background: #f4f7fb; color: #172033; padding: 28px max(20px, 4vw); -webkit-font-smoothing: antialiased; }
    h1 { font-size: 22px; line-height: 1.3; margin: 0 0 5px; }
    .sub { color: #66758a; font-size: 13px; margin-bottom: 20px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px,1fr)); gap: 12px; }
    .card { background: #fff; border: 1px solid #e1e8f1; border-radius: 10px; padding: 15px;
      min-height: 82px; display: flex; align-items: center; justify-content: space-between; gap: 12px;
      box-shadow: 0 2px 8px rgba(28,52,84,.04); transition: border-color .15s, box-shadow .15s; }
    .card.is-current { border-color: #8eafea; background: #edf3ff; box-shadow: 0 4px 14px rgba(37,99,235,.10); }
    .card .name { font-weight: 700; font-size: 15px; }
    .card .meta { font-size: 12px; color: #66758a; margin-top: 3px; }
    .card .code { font-family: ui-monospace, "Cascadia Code", monospace; color: #2459b8; }
    .card > div:last-child { display: flex; gap: 6px; flex: none; }
    .play, .set { border: 1px solid #d3e0f3; background: #edf3ff; color: #2459b8; border-radius: 7px;
      padding: 8px 12px; cursor: pointer; font-size: 13px; font-family: inherit; }
    .set { background: #2563eb !important; border-color: #2563eb; color: #fff; }
    .play:hover, .set:hover { filter: brightness(.97); }
    .play:disabled { background: #e7ebf1; color: #7b8797; cursor: wait; }
    .tip { margin-top: 20px; padding: 13px 15px; background: #edf3ff; border: 1px solid #cddcf7;
      border-radius: 9px; font-size: 13px; color: #2459b8; }
    @media (max-width: 520px) { body { padding: 20px 14px; } .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <h1>选一个你喜欢的嗓音</h1>
  <div class="sub">点"试听"听效果,满意就点"设为小A声音"——立即生效,随时能再换。</div>
  <div class="grid" id="grid"></div>
  <div class="tip">当前小A用的声音会高亮显示。想换随时回这个页面(浏览器打开 <b>/voices</b>)重新选。</div>

  <script src="./ui-language.js"></script>
  <script>
    const IS_LOCAL_FILE = location.protocol === "file:" || !location.host;
    const HOST = IS_LOCAL_FILE ? "127.0.0.1:1985" : location.host;
    const API = (IS_LOCAL_FILE ? "http:" : location.protocol) + "//" + HOST;
    // 样本带英文,方便你对比哪个音色能把 PPT、Excel 读成词而不是一个个字母
    const SAMPLE = "你好,我是小A。这个 PPT 和 Excel 我来帮你搞定,OK?";
    const voices = [
      // ★ 大模型音色(601xxx):更自然、中英混读好,英文不再逐字母。都试听一下挑喜欢的。
      // (名字腾讯没给全,按编号排;下面这些大多是女声/中性,逐个点"试听"用耳朵挑最准)
      { code: 601000, name: "大模型 601000", meta: "自然 · 中英混读好 ★" },
      { code: 601003, name: "大模型 601003", meta: "自然 · 中英混读好 ★" },
      { code: 601005, name: "大模型 601005", meta: "自然 · 中英混读好 ★" },
      { code: 601007, name: "大模型 601007", meta: "自然 · 中英混读好 ★" },
      { code: 601009, name: "大模型 601009", meta: "自然 · 中英混读好 ★" },
      { code: 601010, name: "大模型 601010", meta: "自然 · 中英混读好 ★" },
      { code: 601012, name: "大模型 601012", meta: "自然 · 中英混读好 ★" },
      { code: 601013, name: "大模型 601013", meta: "自然 · 中英混读好 ★" },
      { code: 601014, name: "大模型 601014", meta: "自然 · 中英混读好 ★" },
      { code: 601015, name: "大模型 601015", meta: "自然 · 中英混读好 ★" },
      { code: 601001, name: "大模型 601001(智兰)", meta: "你说不喜欢的那个" },
      // 以下是精品音色(101xxx):英文会被一个个字母念,不推荐用于含英文的场景。
      { code: 101001, name: "智瑜", meta: "女声 · 通用甜美" },
      { code: 101002, name: "智聆", meta: "女声 · 通用" },
      { code: 101004, name: "智云", meta: "男声 · 通用" },
      { code: 101003, name: "智美", meta: "女声 · 客服" },
      { code: 101006, name: "智言", meta: "女声 · 温柔" },
      { code: 101010, name: "智华", meta: "男声 · 稳重" },
      { code: 101013, name: "智辉", meta: "男声 · 浑厚" },
      { code: 101011, name: "智燕", meta: "女声 · 亲切" },
      { code: 101019, name: "智彤", meta: "女声 · 知性" },
      { code: 101007, name: "智娜", meta: "女声 · 客服" },
      { code: 101008, name: "智琪", meta: "女声 · 客服" },
      { code: 101016, name: "智甜", meta: "女童声 · 可爱" },
      { code: 101015, name: "智萌", meta: "男童声 · 活泼" },
      { code: 101017, name: "智蓉", meta: "女声 · 情感" },
      { code: 101018, name: "智靖", meta: "男声 · 情感" },
      { code: 101014, name: "智宁", meta: "男声 · 新闻播报" },
    ];
    let cur = null, currentVoice = null;
    const grid = document.getElementById("grid");

    fetch(API + "/api/current_voice").then(r => r.json()).then(d => {
      currentVoice = d.voice; render();
    }).catch(render);

    function render() {
      grid.innerHTML = "";
      voices.forEach(v => {
        const isCur = v.code === currentVoice;
        const card = document.createElement("div");
        card.className = "card" + (isCur ? " is-current" : "");
        card.innerHTML = `<div><div class="name">${v.name}${isCur ? " ✓当前" : ""}</div>
          <div class="meta">${v.meta} · <span class="code">${v.code}</span></div></div>
          <div style="display:flex;gap:6px">
            <button class="play">试听</button>
            <button class="set">设为</button>
          </div>`;
        card.querySelector(".play").onclick = async (e) => {
          const btn = e.target;
          if (cur) cur.pause();
          btn.disabled = true; btn.textContent = "…";
          try {
            const r = await fetch(API + "/api/tts", {
              method: "POST", headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ text: SAMPLE, voice: v.code }),
            });
            const d = await r.json();
            if (d.ok && d.audio) { cur = new Audio("data:audio/mpeg;base64," + d.audio); cur.play(); }
            else alert("试听失败:" + (d.error || "未知"));
          } catch (e) { alert("试听失败:" + e.message); }
          btn.disabled = false; btn.textContent = "试听";
        };
        card.querySelector(".set").onclick = async () => {
          const r = await fetch(API + "/api/set_voice", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ voice: v.code }),
          });
          const d = await r.json();
          if (d.ok) { currentVoice = v.code; render(); }
          else alert("设置失败:" + (d.error || "未知"));
        };
        grid.appendChild(card);
      });
    }
  </script>
</body>
</html>
