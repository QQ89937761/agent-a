<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'none'" />
  <style>
    :root { color-scheme: light; --brand: #2563eb; --brand-soft: #edf3ff; --ink: #fff; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; font-family: "Segoe UI Variable", "Microsoft YaHei UI", "PingFang SC", "Segoe UI", sans-serif; }
    .notice { width: 100%; height: 100%; padding: 22px; display: flex; align-items: center; justify-content: center; }
    .pill { position: relative; isolation: isolate; width: 100%; height: 56px; padding: 0 20px; display: flex; align-items: center; justify-content: center; gap: 12px; color: var(--ink); background: var(--brand); border: 1px solid rgba(237,243,255,.65); border-radius: 28px; box-shadow: 0 4px 12px rgba(37,99,235,.35); font-size: 18px; font-weight: 600; letter-spacing: .1px; white-space: nowrap; }
    .pill::before, .pill::after { content: ""; position: absolute; pointer-events: none; }
    .pill::before { z-index: -2; inset: -4px; border-radius: 32px; background: linear-gradient(120deg, var(--brand), #2f6fed, var(--brand-soft)); box-shadow: 0 0 12px 4px rgba(37,99,235,.38); opacity: .4; animation: halo-breathe 2.4s ease-in-out infinite; }
    .pill::after { z-index: -1; inset: 0; border-radius: inherit; background: linear-gradient(115deg, var(--brand), #2f6fed); }
    .message { min-width: 0; }
    :lang(en) .pill { font-size: 13px; gap: 8px; padding: 0 12px; }
    .dot { width: 10px; height: 10px; flex: 0 0 10px; background: var(--brand-soft); border-radius: 50%; }
    @keyframes halo-breathe { 0%, 100% { opacity: .4; } 50% { opacity: 1; } }
    @media (max-width: 480px) { .pill { padding: 0 12px; gap: 8px; font-size: 15px; } }
    @media (max-width: 400px) { .notice { padding: 22px 16px; } .pill { font-size: 13px; } }
    @media (max-width: 560px) { :lang(en) .message { white-space: normal; line-height: 1.3; text-align: center; } }
    @media (prefers-reduced-motion: reduce) { .pill::before { animation: none; opacity: .7; } }
  </style>
</head>
<body>
  <div class="notice" role="status" aria-live="polite"><div class="pill"><span class="dot" aria-hidden="true"></span><span class="message">小A正在接管电脑 · 按 Esc 交还控制</span></div></div>
  <script src="./ui-language.js"></script>
</body>
</html>
